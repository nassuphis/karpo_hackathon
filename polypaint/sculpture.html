<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PolyPaint Sculpture</title>
<!--
  Standalone 3D root-sculpture viewer. The (t1,t2) parameter sweep's root sets
  are lifted to z = t2, so the 2D root cloud becomes the shadow of this shape.
  Data arrives via URL-hash params produced by the Render tab's Sculpture
  button: r = roots .bin (f32 interleaved [re,im], serpentine step order),
  p = per-step palette PNG (grid_n x grid_n, de-serpentined row/col layout),
  n = grid_n, d = degree, s = step_count, x0/x1/y0/y1 = xy viewport,
  t = title. Everything is fetched same-origin from the public bucket; the
  page is fully self-contained (vendored three.js via the import map).
-->
<!-- ROOT-ANCHORED vendor paths: the frozen copy of this page lives inside
     sculptures/{id}/, where relative ./vendor/... would resolve to a
     nonexistent nested key. The site serves from the bucket root, so
     absolute paths work at any depth (same convention as gallery.html). -->
<script type="importmap">
{
  "imports": {
    "three": "/vendor/three-r160/three.module.js",
    "three/addons/controls/OrbitControls.js": "/vendor/three-r160/addons/controls/OrbitControls.js",
    "three/addons/controls/PointerLockControls.js": "/vendor/three-r160/addons/controls/PointerLockControls.js"
  }
}
</script>
<style>
  html, body { margin: 0; height: 100%; background: #05070c; color: #cfd8e3;
               font-family: monospace; overflow: hidden; }
  #gl-root { position: fixed; inset: 0; }
  #hud { position: fixed; top: 0; left: 0; right: 0; padding: 10px 14px;
         background: linear-gradient(rgba(5,7,12,0.85), rgba(5,7,12,0));
         pointer-events: none; z-index: 5; }
  #hud-title { font-size: 14px; color: #e8eef5; }
  #hud-stats { font-size: 11px; color: #778599; margin-top: 4px; }
  #hud-hint { font-size: 11px; color: #5b6b80; margin-top: 2px; }
  #btn-menu { position: fixed; top: 10px; right: 12px; z-index: 6;
              background: rgba(10,14,22,0.82); border: 1px solid #232b3a;
              border-radius: 6px; color: #cfd8e3; font: inherit; font-size: 16px;
              padding: 6px 12px; cursor: pointer; }
  #btn-menu:hover { border-color: #e94560; }
  #panel.hidden { display: none; }
  #panel { position: fixed; bottom: 12px; left: 12px; z-index: 5;
           background: rgba(10,14,22,0.82); border: 1px solid #232b3a;
           border-radius: 6px; padding: 10px 12px; font-size: 11px; }
  #panel label { display: flex; align-items: center; gap: 8px; margin: 4px 0;
                 color: #9fb0c3; }
  #panel input[type=range] { width: 130px; accent-color: #e94560; }
  #panel input[type=checkbox] { accent-color: #e94560; margin-left: 6px; }
  #panel select { background: #0d1320; color: #cfd8e3; border: 1px solid #232b3a;
                  border-radius: 4px; font: inherit; padding: 1px 4px; }
  #panel button { background: #0d1320; color: #cfd8e3; border: 1px solid #232b3a;
                  border-radius: 4px; font: inherit; padding: 1px 8px;
                  cursor: pointer; margin-left: 6px; }
  #panel button:hover { border-color: #e94560; }
  #panel .val { width: 4ch; text-align: right; color: #cfd8e3; }
  .dual { position: relative; width: 130px; height: 16px; display: inline-block; }
  .dual::before { content: ''; position: absolute; left: 0; right: 0; top: 7px;
                  height: 2px; background: #232b3a; }
  .dual-fill { position: absolute; top: 7px; height: 2px; background: #e94560;
               pointer-events: none; }
  .dual input[type=range] { position: absolute; left: 0; top: 0; width: 100%;
    height: 16px; margin: 0; background: none; pointer-events: none;
    -webkit-appearance: none; appearance: none; }
  .dual input[type=range]::-webkit-slider-runnable-track { height: 2px; background: transparent; }
  .dual input[type=range]::-moz-range-track { height: 2px; background: transparent; }
  .dual input[type=range]::-webkit-slider-thumb { pointer-events: auto;
    -webkit-appearance: none; appearance: none; width: 12px; height: 12px;
    border-radius: 50%; background: #e94560; border: none; margin-top: -5px; cursor: pointer; }
  .dual input[type=range]::-moz-range-thumb { pointer-events: auto; width: 12px;
    height: 12px; border-radius: 50%; background: #e94560; border: none; cursor: pointer; }
  #message-box { position: fixed; inset: 0; display: none; z-index: 10;
                 align-items: center; justify-content: center; text-align: center;
                 background: #05070c; padding: 24px; }
  #message-box.show { display: flex; }
  #message-box h1 { font-size: 16px; color: #e8eef5; font-weight: normal; }
  #message-box .detail { font-size: 12px; color: #778599; margin-top: 10px;
                         max-width: 60ch; word-break: break-word; }
</style>
</head>
<body>
<div id="gl-root"></div>
<div id="hud">
  <div id="hud-title">PolyPaint sculpture</div>
  <div id="hud-stats">loading…</div>
  <div id="hud-hint"></div>
</div>
<button type="button" id="btn-menu" title="Show / hide controls">&#9776;</button>
<div id="panel">
  <label>point <input id="ctl-size" type="range" min="1" max="40" value="10"><span class="val" id="ctl-size-val"></span></label>
  <label>height <input id="ctl-height" type="range" min="0" max="100" value="10"><span class="val" id="ctl-height-val"></span></label>
  <label>z <select id="ctl-zaxis">
    <option value="t2" selected>t2</option>
    <option value="t1">t1</option>
  </select></label>
  <label>z range
    <span class="dual">
      <span class="dual-fill" id="zrange-fill"></span>
      <input id="ctl-zlo" type="range" min="0" max="100" value="0">
      <input id="ctl-zhi" type="range" min="0" max="100" value="100">
    </span>
    <span class="val" id="ctl-zlo-val"></span>&ndash;<span class="val" id="ctl-zhi-val"></span>
  </label>
  <label>slices <select id="ctl-slices">
    <option value="0" selected>off</option>
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4">4</option>
    <option value="5">5</option>
    <option value="8">8</option>
    <option value="11">11</option>
    <option value="16">16</option>
    <option value="24">24</option>
    <option value="32">32</option>
  </select></label>
  <label>show
    <input id="ctl-show-points" type="checkbox" checked> pts
    <input id="ctl-show-ribbons" type="checkbox"> rib
    <input id="ctl-show-threads" type="checkbox"> thr
    <input id="ctl-show-clu" type="checkbox"> clu
  </label>
  <label>style <select id="ctl-style">
    <option value="solid" selected>solid</option>
    <option value="ghost">ghost</option>
    <option value="cloud">cloud</option>
  </select></label>
  <label>glow <input id="ctl-glow" type="range" min="1" max="100" value="30"><span class="val" id="ctl-glow-val"></span></label>
  <label>rib connect <select id="ctl-order">
    <option value="nearest" selected>nearest</option>
    <option value="angle">angle</option>
    <option value="file">file order</option>
  </select></label>
  <label>len% <input id="ctl-lenq" type="range" min="0" max="100" value="100"><span class="val" id="ctl-lenq-val"></span></label>
  <label>tour <select id="ctl-tour-mode">
    <option value="orbit" selected>orbit</option>
    <option value="wave">wave</option>
    <option value="grand">grand</option>
    <option value="weave">weave</option>
  </select><select id="ctl-tour-speed" title="Tour speed">
    <option value="0.5">&#189;x</option>
    <option value="1" selected>1x</option>
    <option value="2">2x</option>
    <option value="4">4x</option>
  </select><button type="button" id="btn-tour-play" title="Play / stop the automated camera tour">&#9654;</button></label>
</div>
<div id="message-box"><div><h1 id="message-title"></h1><div class="detail" id="message-detail"></div></div></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

// exact color pass-through: the palette PNG's bytes ARE the artwork's colors.
// Default color management treats vertex colors as linear and re-encodes on
// output, washing them out vs the 2D preview — disable both conversions.
THREE.ColorManagement.enabled = false;

function fail(title, detail) {
    document.getElementById('message-title').textContent = title;
    document.getElementById('message-detail').textContent = detail || '';
    document.getElementById('message-box').classList.add('show');
}

function intParam(qp, name) {
    const v = parseInt(qp.get(name) || '', 10);
    return Number.isFinite(v) && v > 0 ? v : NaN;
}

function floatParam(qp, name) {
    const v = parseFloat(qp.get(name) || '');
    return Number.isFinite(v) ? v : NaN;
}

function loadImage(url) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('palette image failed to load: ' + url));
        img.src = url;
    });
}

async function bootConfig() {
    const qp = new URLSearchParams(location.hash.replace(/^#/, ''));
    if (qp.get('r')) {
        return {
            rootsUrl: qp.get('r') || '',
            paletteUrl: qp.get('p') || '',
            gridN: intParam(qp, 'n'),
            degree: intParam(qp, 'd'),
            minRe: floatParam(qp, 'x0'), maxRe: floatParam(qp, 'x1'),
            minIm: floatParam(qp, 'y0'), maxIm: floatParam(qp, 'y1'),
            title: qp.get('t') || 'PolyPaint sculpture',
            saved: false,
        };
    }
    // saved sculpture: the page lives inside its sculptures/{id}/ prefix and
    // reads its sibling meta.json; data keys resolve relative to the prefix
    try {
        const resp = await fetch('./meta.json', { cache: 'no-store' });
        if (!resp.ok) return null;
        const meta = await resp.json();
        const vp = meta.viewport || {};
        return {
            rootsUrl: './' + (meta.roots_key || 'roots.bin'),
            paletteUrl: './' + (meta.palette_key || 'palette.png'),
            gridN: parseInt(meta.grid_n, 10),
            degree: parseInt(meta.degree, 10),
            minRe: parseFloat(vp.min_re), maxRe: parseFloat(vp.max_re),
            minIm: parseFloat(vp.min_im), maxIm: parseFloat(vp.max_im),
            title: String(meta.title || 'PolyPaint sculpture'),
            view: (meta.view && typeof meta.view === 'object') ? meta.view : null,
            saved: true,
        };
    } catch (e) {
        return null;
    }
}

async function boot() {
    const cfg = await bootConfig();
    const { rootsUrl, paletteUrl, gridN, degree, minRe, maxRe, minIm, maxIm, title } = cfg || {};
    // menu toggle: shares open CLEAN (menu off — phone screens), the
    // in-app ephemeral preview opens with controls; the button always works
    const panel = document.getElementById('panel');
    const menuBtn = document.getElementById('btn-menu');
    const setMenu = (on) => {
        panel.classList.toggle('hidden', !on);
        menuBtn.style.opacity = on ? '1' : '0.75';
    };
    menuBtn.addEventListener('click', () => setMenu(panel.classList.contains('hidden')));
    setMenu(!(cfg && cfg.saved));
    document.getElementById('hud-title').textContent = title || 'PolyPaint sculpture';
    if (!cfg || !rootsUrl || !paletteUrl || !Number.isFinite(gridN) || !Number.isFinite(degree)
        || !Number.isFinite(minRe) || !Number.isFinite(maxRe)
        || !Number.isFinite(minIm) || !Number.isFinite(maxIm)
        || !(maxRe > minRe) || !(maxIm > minIm)) {
        fail('No sculpture specified',
             'Open this page from the Render tab’s Sculpture button — it supplies the data links.');
        return;
    }

    let rootsBuf, palImg;
    try {
        [rootsBuf, palImg] = await Promise.all([
            fetch(rootsUrl).then(r => {
                if (!r.ok) throw new Error(`roots fetch ${r.status}`);
                return r.arrayBuffer();
            }),
            loadImage(paletteUrl),
        ]);
    } catch (e) {
        fail('Sculpture data failed to load', String(e && e.message ? e.message : e));
        return;
    }

    const roots = new Float32Array(rootsBuf);
    const passSteps = gridN * gridN;             // pass 0 only
    if (roots.length < passSteps * degree * 2) {
        fail('Sculpture data is too small',
             `roots carry ${roots.length} floats, need ${passSteps * degree * 2} for grid ${gridN}×${gridN} at degree ${degree}.`);
        return;
    }
    // per-step colors: the palette PNG is already de-serpentined to (row, col)
    const palCanvas = document.createElement('canvas');
    palCanvas.width = gridN; palCanvas.height = gridN;
    const palCtx = palCanvas.getContext('2d', { willReadFrequently: true });
    palCtx.imageSmoothingEnabled = false;
    palCtx.drawImage(palImg, 0, 0, gridN, gridN);
    const pal = palCtx.getImageData(0, 0, gridN, gridN).data;

    // cube: xy from the viewport (isotropic by construction), z = t2 in [0,1]
    const cx = (minRe + maxRe) / 2, cy = (minIm + maxIm) / 2;
    const side = Math.max(maxRe - minRe, maxIm - minIm);
    const positions = new Float32Array(passSteps * degree * 3);
    const colors = new Uint8Array(passSteps * degree * 3);
    const pointT2 = new Float32Array(passSteps * degree);
    const pointT1 = new Float32Array(passSteps * degree);
    const stepOffsets = new Int32Array(passSteps + 1);
    let count = 0, clipped = 0;
    for (let step = 0; step < passSteps; step++) {
        const row = Math.floor(step / gridN);
        const j = step % gridN;
        const col = (row & 1) ? (gridN - 1 - j) : j;   // serpentine warm-start order
        const t2 = col / gridN;
        const pi = (row * gridN + col) * 4;
        const cr = pal[pi], cg = pal[pi + 1], cb = pal[pi + 2];
        const base = step * degree * 2;
        for (let r = 0; r < degree; r++) {
            const re = roots[base + r * 2];
            const im = roots[base + r * 2 + 1];
            if (!Number.isFinite(re) || !Number.isFinite(im)
                || re < minRe || re > maxRe || im < minIm || im > maxIm) {
                clipped++;
                continue;
            }
            const o = count * 3;
            positions[o] = (re - cx) / side;          // X = Re
            positions[o + 1] = t2 - 0.5;              // Y (up) = t2
            positions[o + 2] = -(im - cy) / side;     // Z = -Im (right-handed view)
            pointT2[count] = t2;
            pointT1[count] = row / gridN;
            colors[o] = cr; colors[o + 1] = cg; colors[o + 2] = cb;
            count++;
        }
        stepOffsets[step + 1] = count;
    }
    if (!count) {
        fail('No roots inside the viewport', `${clipped} roots were outside the xy extent or non-finite.`);
        return;
    }

    let renderer;
    try {
        renderer = new THREE.WebGLRenderer({ antialias: true });
    } catch (e) {
        fail('WebGL is not available in this browser', String(e && e.message ? e.message : e));
        return;
    }
    renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
    renderer.localClippingEnabled = true;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('gl-root').appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05070c);
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 50);
    camera.position.set(1.25, 0.85, 1.25);

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions.subarray(0, count * 3), 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors.subarray(0, count * 3), 3, true));
    const material = new THREE.PointsMaterial({
        size: 0.004, vertexColors: true, sizeAttenuation: true,
    });
    const points = new THREE.Points(geometry, material);

    // ribbons: one polyline per solve — all roots of a row connected at that
    // row's z, monochrome by construction (the solve-score is per solve).
    // 'angle' tours each row's constellation around its centroid (closed for
    // 3+ roots); 'file' draws the solver's own row order open-ended — for the
    // warm-started Aberth lores solve that order is a fossil of the chain.
    const ribbons = new THREE.LineSegments(
        new THREE.BufferGeometry(),
        new THREE.LineBasicMaterial({ vertexColors: true }));
    let ribbonSegments = 0;
    let applyLenqHook = null;   // assigned in the controls block; re-applied after rebuilds
    // segments are emitted SORTED ascending by length, so the len% quantile
    // slider is a plain setDrawRange — O(1) scrubbing, no geometry rebuild.
    const fillSortedSegments = (geom, segPairs) => {
        const n = segPairs.length / 3;
        const orderIdx = Array.from({ length: n }, (_, i) => i);
        orderIdx.sort((a, b) => segPairs[a * 3 + 2] - segPairs[b * 3 + 2]);
        const lp = new Float32Array(n * 2 * 3);
        const lc = new Uint8Array(n * 2 * 3);
        let lv = 0;
        for (const t of orderIdx) {
            for (const i of [segPairs[t * 3], segPairs[t * 3 + 1]]) {
                lp[lv * 3] = positions[i * 3];
                lp[lv * 3 + 1] = positions[i * 3 + 1];
                lp[lv * 3 + 2] = positions[i * 3 + 2];
                lc[lv * 3] = colors[i * 3];
                lc[lv * 3 + 1] = colors[i * 3 + 1];
                lc[lv * 3 + 2] = colors[i * 3 + 2];
                lv++;
            }
        }
        geom.setAttribute('position', new THREE.BufferAttribute(lp, 3));
        geom.setAttribute('color', new THREE.BufferAttribute(lc, 3, true));
        return n;
    };
    const segLen2 = (i0, i1) => {
        const dx = positions[i0 * 3] - positions[i1 * 3];
        const dy = positions[i0 * 3 + 1] - positions[i1 * 3 + 1];
        const dz = positions[i0 * 3 + 2] - positions[i1 * 3 + 2];
        return dx * dx + dy * dy + dz * dz;
    };
    // clu: per z-column, k-means the WHOLE slice (every root across the
    // varying parameter) and chain each cluster from its FARTHEST point —
    // mid-curve starts guarantee a backtrack chord (measured on real jobs).
    // The clusters approximate the root-trajectory arcs, so clu ribbons are
    // the slice curves themselves. Deterministic: strided init + 8 Lloyd
    // iterations, no randomness (e2e must reproduce exactly).
    function emitClusterChain(members, mx, mz, segPairs) {
        const m = members.length;
        if (m < 2) return;
        let start = 0, bd = -1;
        for (let a = 0; a < m; a++) {
            const dx = positions[members[a] * 3] - mx;
            const dz = positions[members[a] * 3 + 2] - mz;
            const d = dx * dx + dz * dz;
            if (d > bd) { bd = d; start = a; }
        }
        const used = new Uint8Array(m);
        const seq = [members[start]];
        used[start] = 1;
        while (seq.length < m) {
            const cur = seq[seq.length - 1];
            const cxx = positions[cur * 3], czz = positions[cur * 3 + 2];
            let best = -1, dmin = Infinity;
            for (let a = 0; a < m; a++) {
                if (used[a]) continue;
                const dx = positions[members[a] * 3] - cxx;
                const dz = positions[members[a] * 3 + 2] - czz;
                const d = dx * dx + dz * dz;
                if (d < dmin) { dmin = d; best = a; }
            }
            used[best] = 1;
            seq.push(members[best]);
        }
        let cutSq = Infinity;
        if (m > 2) {
            const mins = new Float64Array(m);
            for (let a = 0; a < m; a++) {
                const ax = positions[members[a] * 3], az = positions[members[a] * 3 + 2];
                let dmin = Infinity;
                for (let b = 0; b < m; b++) {
                    if (b === a) continue;
                    const dx = ax - positions[members[b] * 3];
                    const dz = az - positions[members[b] * 3 + 2];
                    const d = dx * dx + dz * dz;
                    if (d < dmin) dmin = d;
                }
                mins[a] = dmin;
            }
            const sorted = Array.from(mins).sort((x, y) => x - y);
            cutSq = 6.25 * sorted[m >> 1];
        }
        for (let t = 0; t + 1 < seq.length; t++) {
            const i0 = seq[t], i1 = seq[t + 1];
            const dx = positions[i0 * 3] - positions[i1 * 3];
            const dz = positions[i0 * 3 + 2] - positions[i1 * 3 + 2];
            if (dx * dx + dz * dz > cutSq) continue;
            segPairs.push(i0, i1, segLen2(i0, i1));
        }
    }
    function cluSegments(segPairs) {
        const axis = document.getElementById('ctl-zaxis').value === 't1' ? 't1' : 't2';
        const pts = [];
        for (let zi = 0; zi < gridN; zi++) {
            pts.length = 0;
            for (let vi = 0; vi < gridN; vi++) {
                const st = axis === 't1' ? stepAt(zi, vi) : stepAt(vi, zi);
                for (let i = stepOffsets[st]; i < stepOffsets[st + 1]; i++) pts.push(i);
            }
            const n = pts.length;
            if (n < 2) continue;
            const k = Math.max(1, Math.min(degree, n));
            const cx = new Float64Array(k), cz = new Float64Array(k);
            for (let j = 0; j < k; j++) {
                const p = pts[Math.floor(j * n / k)];
                cx[j] = positions[p * 3];
                cz[j] = positions[p * 3 + 2];
            }
            const assign = new Int32Array(n);
            for (let iter = 0; iter < 8; iter++) {
                for (let a = 0; a < n; a++) {
                    const px = positions[pts[a] * 3], pz = positions[pts[a] * 3 + 2];
                    let best = 0, bdst = Infinity;
                    for (let j = 0; j < k; j++) {
                        const dx = px - cx[j], dz = pz - cz[j];
                        const d = dx * dx + dz * dz;
                        if (d < bdst) { bdst = d; best = j; }
                    }
                    assign[a] = best;
                }
                const sx = new Float64Array(k), sz = new Float64Array(k), cnt = new Int32Array(k);
                for (let a = 0; a < n; a++) {
                    const j = assign[a];
                    sx[j] += positions[pts[a] * 3];
                    sz[j] += positions[pts[a] * 3 + 2];
                    cnt[j]++;
                }
                for (let j = 0; j < k; j++) {
                    if (cnt[j]) { cx[j] = sx[j] / cnt[j]; cz[j] = sz[j] / cnt[j]; }
                }
            }
            for (let j = 0; j < k; j++) {
                const members = [];
                for (let a = 0; a < n; a++) if (assign[a] === j) members.push(pts[a]);
                emitClusterChain(members, cx[j], cz[j], segPairs);
            }
        }
    }
    const cluRibbons = new THREE.LineSegments(
        new THREE.BufferGeometry(),
        new THREE.LineBasicMaterial({ vertexColors: true }));
    let cluSegCount = 0;
    function buildClu() {
        const segPairs = [];
        cluSegments(segPairs);
        const geom = new THREE.BufferGeometry();
        const n = fillSortedSegments(geom, segPairs);
        const old = cluRibbons.geometry;
        cluRibbons.geometry = geom;
        if (old) old.dispose();
        cluSegCount = n;
        if (applyLenqHook) applyLenqHook();
    }
    function buildRibbons(order) {
        const segPairs = [];   // [i0, i1, len2] triples, flat
        const idx = [];
        for (let step = 0; step < passSteps; step++) {
            const a = stepOffsets[step], b = stepOffsets[step + 1];
            const k = b - a;
            if (k < 2) continue;
            idx.length = 0;
            for (let i = a; i < b; i++) idx.push(i);
            if (order === 'angle') {
                let mx = 0, mz = 0;
                for (const i of idx) { mx += positions[i * 3]; mz += positions[i * 3 + 2]; }
                mx /= k; mz /= k;
                const ang = i => Math.atan2(positions[i * 3 + 2] - mz, positions[i * 3] - mx);
                idx.sort((p, q) => ang(p) - ang(q));
            } else if (order === 'nearest') {
                // greedy nearest-neighbor chain (k^2): start at the root
                // farthest from the centroid — a natural chain end, stable
                // across neighboring solves — and hop to nearest unvisited
                let mx = 0, mz = 0;
                for (const i of idx) { mx += positions[i * 3]; mz += positions[i * 3 + 2]; }
                mx /= k; mz /= k;
                let start = 0, bestD = -1;
                for (let t = 0; t < k; t++) {
                    const dx = positions[idx[t] * 3] - mx, dz = positions[idx[t] * 3 + 2] - mz;
                    const d = dx * dx + dz * dz;
                    if (d > bestD) { bestD = d; start = t; }
                }
                const used = new Uint8Array(k);
                const seq = [idx[start]];
                used[start] = 1;
                while (seq.length < k) {
                    const cur = seq[seq.length - 1];
                    const cx0 = positions[cur * 3], cz0 = positions[cur * 3 + 2];
                    let best = -1, bd = Infinity;
                    for (let t = 0; t < k; t++) {
                        if (used[t]) continue;
                        const dx = positions[idx[t] * 3] - cx0, dz = positions[idx[t] * 3 + 2] - cz0;
                        const d = dx * dx + dz * dz;
                        if (d < bd) { bd = d; best = t; }
                    }
                    used[best] = 1;
                    seq.push(idx[best]);
                }
                idx.length = 0;
                for (const i of seq) idx.push(i);
            }
            const close = order === 'angle' && k >= 3;
            const segs = close ? k : k - 1;
            // nearest mode: never bridge clusters. These constellations are
            // typically 2-4 separated groups (conjugate bands + outliers) and
            // ANY full path is forced to cross between them — those forced
            // chords were the visible "ribbon jumping" (2-opt measured
            // useless: the chords are topology, not greedy error). Segments
            // longer than 2.5x the solve's median nearest-neighbor distance
            // are cut, leaving one short strand per cluster.
            let cutSq = Infinity;
            if (order === 'nearest' && k > 2) {
                const mins = new Float64Array(k);
                for (let a = 0; a < k; a++) {
                    const ax = positions[idx[a] * 3], az = positions[idx[a] * 3 + 2];
                    let bd = Infinity;
                    for (let b = 0; b < k; b++) {
                        if (b === a) continue;
                        const dx = ax - positions[idx[b] * 3];
                        const dz = az - positions[idx[b] * 3 + 2];
                        const dd = dx * dx + dz * dz;
                        if (dd < bd) bd = dd;
                    }
                    mins[a] = bd;
                }
                const sorted = Array.from(mins).sort((x, y) => x - y);
                cutSq = 6.25 * sorted[k >> 1];   // (2.5 x median NN)^2
            }
            for (let t = 0; t < segs; t++) {
                const i0 = idx[t], i1 = idx[(t + 1) % k];
                if (cutSq !== Infinity) {
                    const dx = positions[i0 * 3] - positions[i1 * 3];
                    const dz = positions[i0 * 3 + 2] - positions[i1 * 3 + 2];
                    if (dx * dx + dz * dz > cutSq) continue;
                }
                segPairs.push(i0, i1, segLen2(i0, i1));
            }
        }
        const geom = new THREE.BufferGeometry();
        const n = fillSortedSegments(geom, segPairs);
        const old = ribbons.geometry;
        ribbons.geometry = geom;
        if (old) old.dispose();
        ribbonSegments = n;
        if (applyLenqHook) applyLenqHook();
    }

    // threads: root trajectories along t2 — each solve matched to the NEXT
    // t2 column in its t1 row by mutual-nearest on complex-plane (xz)
    // distance, greedy repair for the leftovers (root collisions are
    // genuinely ambiguous; warm-started solves are near-identity anyway).
    // Matching ignores Y entirely, so slices/height never invalidate it.
    const threads = new THREE.LineSegments(
        new THREE.BufferGeometry(),
        new THREE.LineBasicMaterial({ vertexColors: true }));
    let threadMatches = { t2: null, t1: null };   // per-axis pair entries, lazy
    let threadSegments = 0;
    function matchPair(a0, ka, b0, kb) {
        const D = new Float32Array(ka * kb);
        for (let i = 0; i < ka; i++) {
            const ax = positions[(a0 + i) * 3], az = positions[(a0 + i) * 3 + 2];
            for (let j = 0; j < kb; j++) {
                const dx = ax - positions[(b0 + j) * 3];
                const dz = az - positions[(b0 + j) * 3 + 2];
                D[i * kb + j] = dx * dx + dz * dz;
            }
        }
        const rowMin = new Int32Array(ka), colMin = new Int32Array(kb);
        for (let i = 0; i < ka; i++) {
            let best = 0;
            for (let j = 1; j < kb; j++) if (D[i * kb + j] < D[i * kb + best]) best = j;
            rowMin[i] = best;
        }
        for (let j = 0; j < kb; j++) {
            let best = 0;
            for (let i = 1; i < ka; i++) if (D[i * kb + j] < D[best * kb + j]) best = i;
            colMin[j] = best;
        }
        const usedA = new Uint8Array(ka), usedB = new Uint8Array(kb);
        const out = [];
        for (let i = 0; i < ka; i++) {
            const j = rowMin[i];
            if (colMin[j] === i) { out.push(a0 + i, b0 + j); usedA[i] = 1; usedB[j] = 1; }
        }
        const ua = [], ub = [];
        for (let i = 0; i < ka; i++) if (!usedA[i]) ua.push(i);
        for (let j = 0; j < kb; j++) if (!usedB[j]) ub.push(j);
        if (ua.length && ub.length) {
            const cand = [];
            for (const i of ua) for (const j of ub) cand.push([D[i * kb + j], i, j]);
            cand.sort((p, q) => p[0] - q[0]);
            for (const [, i, j] of cand) {
                if (usedA[i] || usedB[j]) continue;
                usedA[i] = 1; usedB[j] = 1;
                out.push(a0 + i, b0 + j);
            }
        }
        return Int32Array.from(out);
    }
    const stepAt = (r, c) => r * gridN + ((r & 1) ? (gridN - 1 - c) : c);
    function computeThreadMatches(axis) {
        // threads climb the CURRENT z axis: t2 mode matches adjacent columns
        // within a t1 row; t1 mode matches adjacent rows within a t2 column.
        // Each entry keeps the two solves' z-parameters for the slice gate.
        const entries = [];
        const addPair = (sa, sb, ta, tb) => {
            const a0 = stepOffsets[sa], ka = stepOffsets[sa + 1] - a0;
            const b0 = stepOffsets[sb], kb = stepOffsets[sb + 1] - b0;
            if (ka > 0 && kb > 0) entries.push({ m: matchPair(a0, ka, b0, kb), ta, tb });
        };
        if (axis === 't1') {
            for (let c = 0; c < gridN; c++) {
                for (let r = 0; r < gridN - 1; r++) {
                    addPair(stepAt(r, c), stepAt(r + 1, c), r / gridN, (r + 1) / gridN);
                }
            }
        } else {
            for (let r = 0; r < gridN; r++) {
                for (let c = 0; c < gridN - 1; c++) {
                    addPair(stepAt(r, c), stepAt(r, c + 1), c / gridN, (c + 1) / gridN);
                }
            }
        }
        return entries;
    }
    function buildThreads() {
        // per slice: threads NEVER bridge plates — an adjacent pair is drawn
        // only when both solves land on the same plate (slices off: all)
        const axis = document.getElementById('ctl-zaxis').value === 't1' ? 't1' : 't2';
        if (!threadMatches[axis]) threadMatches[axis] = computeThreadMatches(axis);
        const S = Math.max(0, parseInt(document.getElementById('ctl-slices').value, 10) || 0);
        const levelOf = t => Math.min(S - 1, Math.floor(t * S));
        const segPairs = [];
        for (const entry of threadMatches[axis]) {
            if (S > 0 && levelOf(entry.ta) !== levelOf(entry.tb)) continue;
            const m = entry.m;
            for (let t = 0; t < m.length; t += 2) {
                segPairs.push(m[t], m[t + 1], segLen2(m[t], m[t + 1]));
            }
        }
        const geom = new THREE.BufferGeometry();
        const n = fillSortedSegments(geom, segPairs);
        const oldGeom = threads.geometry;
        threads.geometry = geom;
        if (oldGeom) oldGeom.dispose();
        threadSegments = n;
        if (applyLenqHook) applyLenqHook();
    }

    // z-window: two world-space clipping planes slab the visible height
    // range — fragment-level, no rebuild, segments cut exactly at the plane.
    // The cube frame stays unclipped as the spatial reference.
    const clipLo = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0.5);
    const clipHi = new THREE.Plane(new THREE.Vector3(0, -1, 0), 0.5);
    material.clippingPlanes = [clipLo, clipHi];
    ribbons.material.clippingPlanes = [clipLo, clipHi];
    threads.material.clippingPlanes = [clipLo, clipHi];
    cluRibbons.material.clippingPlanes = [clipLo, clipHi];

    // CLOUD style: soft gaussian splats accumulated ADDITIVELY into a
    // half-float buffer, then tone-mapped 1-exp(-x·exposure) — the 2D
    // pipeline's density aesthetic in 3D: stacked sheets glow, caustics
    // bloom, isolated points stay faint. Lines go additive in this style.
    const cloudUniforms = {
        uSize: { value: 0.004 },
        uScale: { value: 300 },
        uIntensity: { value: 0.25 },
    };
    const cloudMat = new THREE.ShaderMaterial({
        uniforms: cloudUniforms,
        vertexColors: true,
        clipping: true,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        vertexShader: [
            '#include <clipping_planes_pars_vertex>',
            'uniform float uSize;',
            'uniform float uScale;',
            'varying vec3 vColor;',
            'void main() {',
            '    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);',
            '    gl_Position = projectionMatrix * mvPosition;',
            '    gl_PointSize = uSize * uScale / -mvPosition.z;',
            '    vColor = color;',
            '    #include <clipping_planes_vertex>',
            '}',
        ].join('\n'),
        fragmentShader: [
            '#include <clipping_planes_pars_fragment>',
            'uniform float uIntensity;',
            'varying vec3 vColor;',
            'void main() {',
            '    #include <clipping_planes_fragment>',
            '    vec2 c = gl_PointCoord * 2.0 - 1.0;',
            '    float r2 = dot(c, c);',
            '    if (r2 > 1.0) discard;',
            '    float a = exp(-3.0 * r2);',
            '    gl_FragColor = vec4(vColor * a * uIntensity, 1.0);',
            '}',
        ].join('\n'),
    });
    cloudMat.clippingPlanes = [clipLo, clipHi];
    const cloudRT = new THREE.WebGLRenderTarget(2, 2, { type: THREE.HalfFloatType });
    const tonemapCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const tonemapMat = new THREE.ShaderMaterial({
        uniforms: { tMap: { value: cloudRT.texture }, uExposure: { value: 1.5 } },
        depthWrite: false,
        depthTest: false,
        vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
        fragmentShader: [
            'varying vec2 vUv;',
            'uniform sampler2D tMap;',
            'uniform float uExposure;',
            'void main(){',
            '    vec3 c = texture2D(tMap, vUv).rgb;',
            '    gl_FragColor = vec4(vec3(1.0) - exp(-c * uExposure), 1.0);',
            '}',
        ].join('\n'),
    });
    const tonemapScene = new THREE.Scene();
    tonemapScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), tonemapMat));

    const sculpt = new THREE.Group();
    sculpt.add(points);
    sculpt.add(ribbons);
    sculpt.add(threads);
    sculpt.add(cluRibbons);
    scene.add(sculpt);

    const frame = new THREE.LineSegments(
        new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1)),
        new THREE.LineBasicMaterial({ color: 0x2a3550 }));
    scene.add(frame);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;

    // fly mode: double-click locks the pointer for mouse look; WASD moves
    // along the TRUE look direction (not walk-plane), Q/E down/up, Shift
    // sprints, Esc exits back to orbit — the orbit target re-anchors ahead
    // of wherever you flew so the handoff doesn't snap.
    const fly = new PointerLockControls(camera, renderer.domElement);
    const flyKeys = { f: 0, b: 0, l: 0, r: 0, u: 0, d: 0, sprint: 0 };
    const flight = { keys: flyKeys, plc: fly, forceActive: false, tick: null };
    const hintEl = document.getElementById('hud-hint');
    const setHint = () => {
        hintEl.textContent = fly.isLocked
            ? 'flying — WASD move · Q/E down/up · Shift fast · Esc exits'
            : 'drag: orbit · wheel: zoom · double-click: fly (WASD + mouse)';
    };
    renderer.domElement.addEventListener('dblclick', () => fly.lock());
    fly.addEventListener('lock', () => { controls.enabled = false; setHint(); });
    fly.addEventListener('unlock', () => {
        const ahead = new THREE.Vector3();
        camera.getWorldDirection(ahead);
        controls.target.copy(camera.position).addScaledVector(ahead, 0.8);
        controls.enabled = true;
        setHint();
    });
    const setKey = (ev, v) => {
        const tag = ev.target && ev.target.tagName;
        if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
        switch (ev.code) {
            case 'KeyW': flyKeys.f = v; break;
            case 'KeyS': flyKeys.b = v; break;
            case 'KeyA': flyKeys.l = v; break;
            case 'KeyD': flyKeys.r = v; break;
            case 'KeyQ': flyKeys.d = v; break;
            case 'KeyE': flyKeys.u = v; break;
            case 'ShiftLeft':
            case 'ShiftRight': flyKeys.sprint = v; break;
            default: return;
        }
        if (v && tour.playing) tourSetPlaying(false);
        ev.preventDefault();
    };
    document.addEventListener('keydown', ev => setKey(ev, 1));
    document.addEventListener('keyup', ev => setKey(ev, 0));
    const flyDir = new THREE.Vector3();
    const flyRight = new THREE.Vector3();
    const flyTick = (dt) => {
        if (!fly.isLocked && !flight.forceActive) return;
        const speed = 0.45 * (flyKeys.sprint ? 3 : 1) * dt;
        if (!speed) return;
        camera.getWorldDirection(flyDir);
        flyRight.crossVectors(flyDir, camera.up).normalize();
        camera.position.addScaledVector(flyDir, (flyKeys.f - flyKeys.b) * speed);
        camera.position.addScaledVector(flyRight, (flyKeys.r - flyKeys.l) * speed);
        camera.position.y += (flyKeys.u - flyKeys.d) * speed;
    };
    flight.tick = flyTick;

    // automated tours: parametric camera paths, deterministic in t.
    // orbit = exterior helical turntable (whole-form pass); weave = interior
    // corkscrew with a breathing radius sweeping the full height (the
    // close-up detail pass). Both follow the HEIGHT-SCALED geometry, so a
    // squashed plate stack gets a low skimming pass instead of empty air.
    // tours adopt the camera pose at PLAY time (user: "orbit too close —
    // take my current distance, I navigate to where the orbit starts"):
    // orbit circles at exactly the play-time radius, height, and azimuth
    // (zero jump by construction); weave keeps its programmed corkscrew but
    // starts at the play-time azimuth and EASES IN from the current pose.
    const tour = { playing: false, t: 0, r0: 1.35, y0: 0.5, angle0: 0, blend: 1, wavePhase: 0,
                   gTop: 1.5, gBot: -0.5, gPhase0: 0 };
    const tourBlendFrom = new THREE.Vector3();
    const tourBlendLook = new THREE.Vector3();
    const tourBtn = document.getElementById('btn-tour-play');
    const tourModeCtl = document.getElementById('ctl-tour-mode');
    const tourSpeedCtl = document.getElementById('ctl-tour-speed');
    const waveAmp = (hh) => Math.max(0.08, hh * 1.05);
    const tourPose = (mode, t, heightScale) => {
        const hh = Math.max(0.06, 0.5 * heightScale);
        if (mode === 'weave') {
            const angle = tour.angle0 + t * 0.55;
            const radius = 0.5 + 0.4 * Math.sin(t * 0.23);
            const y = Math.sin(t * 0.11) * hh * 1.05;
            return { pos: [Math.cos(angle) * radius, y, Math.sin(angle) * radius],
                     look: [0, y * 0.6, 0] };
        }
        if (mode === 'grand') {
            // grand: a stately 4-lap cycle at the play-time radius — a full
            // circle at the TOP plateau, a smoothstep descent lap, a full
            // circle at the BOTTOM plateau, an ascent lap — always watching
            // the center. Plateaus default to +1.5/-0.5; starting beyond
            // them adopts your height as the plateau magnitude, mirrored
            // through the cube center, and the cycle begins at the nearer
            // plateau so you start circling at your own level (user spec).
            const angle = tour.angle0 + t * 0.35;
            const phase = (((t * 0.35) / (2 * Math.PI)) + tour.gPhase0) % 4;
            const yTop = tour.gTop, yBot = tour.gBot;
            let y;
            if (phase < 1) y = yTop;
            else if (phase < 2) {
                const u = phase - 1, w = u * u * (3 - 2 * u);
                y = yTop + (yBot - yTop) * w;
            } else if (phase < 3) y = yBot;
            else {
                const u = phase - 3, w = u * u * (3 - 2 * u);
                y = yBot + (yTop - yBot) * w;
            }
            return { pos: [Math.cos(angle) * tour.r0, y, Math.sin(angle) * tour.r0],
                     look: [0, 0, 0] };
        }
        if (mode === 'wave') {
            // wave: the orbit's circle plus a vertical sine spanning the
            // scaled stack — 3 bobs per lap (a closed crown), phase-matched
            // to START at the play-time height and rise first (user spec:
            // "start at my current height, continue to top then down")
            const angle = tour.angle0 + t * 0.35;
            const y = waveAmp(hh) * Math.sin(1.05 * t + tour.wavePhase);
            return { pos: [Math.cos(angle) * tour.r0, y, Math.sin(angle) * tour.r0],
                     look: [0, 0, 0] };
        }
        const angle = tour.angle0 + t * 0.35;
        return { pos: [Math.cos(angle) * tour.r0, tour.y0, Math.sin(angle) * tour.r0],
                 look: [0, 0, 0] };
    };
    const tourTick = (dt) => {
        if (!tour.playing) return;
        tour.t += dt * (parseFloat(tourSpeedCtl.value) || 1);
        const p = tourPose(tourModeCtl.value, tour.t, sculpt.scale.y);
        if (tour.blend < 1) {
            tour.blend = Math.min(1, tour.blend + dt / 1.2);
            const w = tour.blend * tour.blend * (3 - 2 * tour.blend);   // smoothstep
            camera.position.set(
                tourBlendFrom.x + (p.pos[0] - tourBlendFrom.x) * w,
                tourBlendFrom.y + (p.pos[1] - tourBlendFrom.y) * w,
                tourBlendFrom.z + (p.pos[2] - tourBlendFrom.z) * w);
            camera.lookAt(
                tourBlendLook.x + (p.look[0] - tourBlendLook.x) * w,
                tourBlendLook.y + (p.look[1] - tourBlendLook.y) * w,
                tourBlendLook.z + (p.look[2] - tourBlendLook.z) * w);
            return;
        }
        camera.position.set(p.pos[0], p.pos[1], p.pos[2]);
        camera.lookAt(p.look[0], p.look[1], p.look[2]);
    };
    const tourSetPlaying = (on) => {
        if (on && fly.isLocked) fly.unlock();
        tour.playing = on;
        controls.enabled = !on && !fly.isLocked;
        if (tourBtn) tourBtn.textContent = on ? '\u25a0' : '\u25b6';
        if (on) {
            const p = camera.position;
            tour.t = 0;
            tour.r0 = Math.max(0.05, Math.hypot(p.x, p.z));
            tour.y0 = p.y;
            tour.angle0 = Math.atan2(p.z, p.x);
            const amp = waveAmp(Math.max(0.06, 0.5 * sculpt.scale.y));
            tour.wavePhase = Math.asin(Math.max(-1, Math.min(1, p.y / amp)));
            const gMag = Math.max(1.5, Math.abs(p.y));
            tour.gTop = gMag;
            tour.gBot = gMag > 1.5 ? -gMag : -0.5;
            tour.gPhase0 = p.y < (tour.gTop + tour.gBot) / 2 ? 2 : 0;
            // orbit and wave adopt the pose exactly (no jump); weave and
            // grand ease in (grand's plateaus are program levels)
            tour.blend = (tourModeCtl.value === 'weave' || tourModeCtl.value === 'grand') ? 0 : 1;
            tourBlendFrom.copy(p);
            camera.getWorldDirection(tourBlendLook);
            tourBlendLook.multiplyScalar(1.0).add(p);
        } else {
            // hand the pivot back at the tour's own look point — the cube
            // middle for orbit. The fly-exit "0.9 ahead" anchor moved the
            // rotation center to the VIEWPOINT (user-caught: drags then
            // orbited the camera, not the sculpture, feeling reversed).
            const p = tourPose(tourModeCtl.value, tour.t, sculpt.scale.y);
            controls.target.set(p.look[0], p.look[1], p.look[2]);
        }
    };
    tourBtn.addEventListener('click', () => tourSetPlaying(!tour.playing));
    tourModeCtl.addEventListener('change', () => { tour.t = 0; });
    // any manual camera interaction hands control back
    renderer.domElement.addEventListener('pointerdown', () => {
        if (tour.playing) tourSetPlaying(false);
    });
    fly.addEventListener('lock', () => { if (tour.playing) tourSetPlaying(false); });
    setHint();

    const updateStats = () => {
        document.getElementById('hud-stats').textContent =
            `${count.toLocaleString()} roots · grid ${gridN}×${gridN} · degree ${degree}` +
            ` · z = ${zaxisCtl.value} · clipped ${clipped.toLocaleString()}` +
            ` · ${ribbonSegments.toLocaleString()} ribbon segments` +
            (threadSegments ? ` · ${threadSegments.toLocaleString()} thread segments` : '') +
            (cluSegCount ? ` · ${cluSegCount.toLocaleString()} clu segments` : '') +
            (parseInt(slicesCtl.value, 10) > 0 ? ` · ${slicesCtl.value} slices` : '') +
            (parseInt(document.getElementById('ctl-lenq').value, 10) < 100
                ? ` · len ≤ ${document.getElementById('ctl-lenq').value}%` : '') +
            ((parseInt(document.getElementById('ctl-zlo').value, 10) > 0
              || parseInt(document.getElementById('ctl-zhi').value, 10) < 100)
                ? ` · z∈[${(parseInt(document.getElementById('ctl-zlo').value, 10) / 100).toFixed(2)},${(parseInt(document.getElementById('ctl-zhi').value, 10) / 100).toFixed(2)}]` : '');
    };

    const showPointsCtl = document.getElementById('ctl-show-points');
    const showRibbonsCtl = document.getElementById('ctl-show-ribbons');
    const showThreadsCtl = document.getElementById('ctl-show-threads');
    const showCluCtl = document.getElementById('ctl-show-clu');
    const orderCtl = document.getElementById('ctl-order');
    const slicesCtl = document.getElementById('ctl-slices');
    const zaxisCtl = document.getElementById('ctl-zaxis');
    const styleCtl = document.getElementById('ctl-style');
    // solid: opaque + depth-written — occlusion is correct from every angle
    // (depthWrite:false let bottom plates paint over nearer top plates: what
    // wins a pixel was DRAW order, not distance). ghost: the translucent
    // veil — unsorted transparency, ordering artifacts are inherent there.
    const applyStyle = () => {
        const ghost = styleCtl.value === 'ghost';
        const cloud = styleCtl.value === 'cloud';
        points.material = cloud ? cloudMat : material;
        material.transparent = ghost;
        material.opacity = ghost ? 0.92 : 1;
        material.depthWrite = !ghost;
        material.needsUpdate = true;
        for (const m of [ribbons.material, threads.material, cluRibbons.material]) {
            m.blending = cloud ? THREE.AdditiveBlending : THREE.NormalBlending;
            m.transparent = ghost || cloud;
            m.opacity = cloud ? 0.35 : (ghost ? 0.55 : 1);
            m.depthWrite = !(ghost || cloud);
            m.needsUpdate = true;
        }
    };
    // slices: bin t2 onto S discrete plates spanning the cube (S=11 -> z = 0,
    // 0.1, ..., 1.0). Every solve sits at one t2, so whole ribbons land
    // intact on their plate — the sculpture becomes an exploded shadow.
    const applySlices = () => {
        const slices = Math.max(0, parseInt(slicesCtl.value, 10) || 0);
        const zt = zaxisCtl.value === 't1' ? pointT1 : pointT2;
        for (let i = 0; i < count; i++) {
            const t = zt[i];
            let z = t;
            if (slices > 0) {
                const level = Math.min(slices - 1, Math.floor(t * slices));
                z = slices > 1 ? level / (slices - 1) : 0.5;
            }
            positions[i * 3 + 1] = z - 0.5;
        }
        geometry.getAttribute('position').needsUpdate = true;
        buildRibbons(orderCtl.value);
        if (showThreadsCtl.checked) buildThreads();
        if (showCluCtl.checked) buildClu();
        updateStats();
    };
    const applyShow = () => {
        points.visible = showPointsCtl.checked;
        ribbons.visible = showRibbonsCtl.checked;
        if (showThreadsCtl.checked) buildThreads();   // lazy per-axis matching, cached
        threads.visible = showThreadsCtl.checked;
        if (showCluCtl.checked) buildClu();           // lazy per-slice clustering
        cluRibbons.visible = showCluCtl.checked;
        updateStats();
    };
    const applyOrder = () => {
        buildRibbons(orderCtl.value);
        updateStats();
    };
    showPointsCtl.addEventListener('change', applyShow);
    showRibbonsCtl.addEventListener('change', applyShow);
    showThreadsCtl.addEventListener('change', applyShow);
    showCluCtl.addEventListener('change', applyShow);
    orderCtl.addEventListener('change', applyOrder);
    slicesCtl.addEventListener('change', applySlices);
    zaxisCtl.addEventListener('change', applySlices);
    styleCtl.addEventListener('change', applyStyle);
    const lenqCtl = document.getElementById('ctl-lenq');
    const lenqVal = document.getElementById('ctl-lenq-val');
    // len% quantile: draw only the shortest q% of ribbon/thread segments.
    // Scrubbing down watches the longest links die first — the jumpy regions
    // announce themselves (a persistence filtration on the connection graph).
    const applyLenq = () => {
        const q = Math.max(0, Math.min(100, parseInt(lenqCtl.value, 10) || 0));
        lenqVal.textContent = String(q);
        ribbons.geometry.setDrawRange(0, 2 * Math.round((q / 100) * ribbonSegments));
        threads.geometry.setDrawRange(0, 2 * Math.round((q / 100) * threadSegments));
        cluRibbons.geometry.setDrawRange(0, 2 * Math.round((q / 100) * cluSegCount));
        updateStats();
    };
    applyLenqHook = applyLenq;
    lenqCtl.addEventListener('input', applyLenq);
    const sizeCtl = document.getElementById('ctl-size');
    const sizeVal = document.getElementById('ctl-size-val');
    const heightCtl = document.getElementById('ctl-height');
    const heightVal = document.getElementById('ctl-height-val');
    const glowCtl = document.getElementById('ctl-glow');
    const glowVal = document.getElementById('ctl-glow-val');
    const applyGlow = () => {
        const g = Math.max(1, Math.min(100, parseInt(glowCtl.value, 10) || 30));
        tonemapMat.uniforms.uExposure.value = g / 20;
        glowVal.textContent = String(g);
    };
    glowCtl.addEventListener('input', applyGlow);
    const applySize = () => {
        material.size = Number(sizeCtl.value) * 0.0004;
        cloudUniforms.uSize.value = Number(sizeCtl.value) * 0.0004;
        sizeVal.textContent = sizeCtl.value;
    };
    // height 0 flattens the sculpture onto its base plane: the 2D art is
    // literally this shape's shadow, and the slider shows it
    const applyHeight = () => {
        const h = Number(heightCtl.value) / 100;
        sculpt.scale.y = h;
        frame.scale.y = Math.max(h, 0.001);
        heightVal.textContent = h.toFixed(2);
    };
    const zloCtl = document.getElementById('ctl-zlo');
    const zloVal = document.getElementById('ctl-zlo-val');
    const zhiCtl = document.getElementById('ctl-zhi');
    const zhiVal = document.getElementById('ctl-zhi-val');
    const applyZRange = () => {
        const lo = Math.max(0, Math.min(100, parseInt(zloCtl.value, 10) || 0)) / 100;
        const hi = Math.max(0, Math.min(100, parseInt(zhiCtl.value, 10) || 0)) / 100;
        const sy = sculpt.scale.y;
        // keep y >= (lo-0.5)*sy and y <= (hi-0.5)*sy, in world space. The
        // 0.005 margin pushes both planes outward so the FULL range never
        // clips boundary geometry (plates sit at exactly +-0.5*sy, and a
        // plane at the same float value culls them to rounding).
        clipLo.constant = -(lo - 0.5) * sy + 0.005;
        clipHi.constant = (hi - 0.5) * sy + 0.005;
        zloVal.textContent = lo.toFixed(2);
        zhiVal.textContent = hi.toFixed(2);
        const fill = document.getElementById('zrange-fill');
        if (fill) {
            fill.style.left = (lo * 100) + '%';
            fill.style.width = ((hi - lo) * 100) + '%';
        }
        // coincident-thumb rescue: when both knobs stack, the grabbable one
        // must be the one that can still move — lo on top in the upper half,
        // hi on top in the lower half
        zloCtl.style.zIndex = (lo * 100 > 50) ? 5 : 3;
        zhiCtl.style.zIndex = 4;
        updateStats();
    };
    zloCtl.addEventListener('input', () => {
        if (parseInt(zloCtl.value, 10) > parseInt(zhiCtl.value, 10)) zloCtl.value = zhiCtl.value;
        applyZRange();
    });
    zhiCtl.addEventListener('input', () => {
        if (parseInt(zhiCtl.value, 10) < parseInt(zloCtl.value, 10)) zhiCtl.value = zloCtl.value;
        applyZRange();
    });
    sizeCtl.addEventListener('input', applySize);
    heightCtl.addEventListener('input', applyHeight);
    heightCtl.addEventListener('input', applyZRange);   // world constants track the scale
    // saved view settings: the creator tuned the ephemeral viewer and Create
    // snapshotted it — apply controls, then re-run the apply chain, then
    // autoplay the captured tour so shares open as prepared flythroughs
    const applyViewConfig = (view) => {
        if (!view) return;
        if (Number.isFinite(Number(view.point))) {
            sizeCtl.value = String(Math.max(1, Math.min(40, Math.round(Number(view.point)))));
        }
        if (Number.isFinite(Number(view.height))) {
            heightCtl.value = String(Math.max(0, Math.min(100, Math.round(Number(view.height) * 100))));
        }
        if (Number.isFinite(Number(view.slices))) {
            const v = String(Math.max(0, Math.min(64, Math.round(Number(view.slices)))));
            if (Array.from(slicesCtl.options).some(o => o.value === v)) slicesCtl.value = v;
        }
        if (view.show && typeof view.show === 'object') {
            showPointsCtl.checked = !!view.show.points;
            showRibbonsCtl.checked = !!view.show.ribbons;
            showThreadsCtl.checked = !!view.show.threads;
            showCluCtl.checked = !!view.show.clu;
        }
        if (['solid', 'ghost', 'cloud'].includes(view.style)) styleCtl.value = view.style;
        if (Number.isFinite(Number(view.glow))) {
            glowCtl.value = String(Math.max(1, Math.min(100, Math.round(Number(view.glow)))));
        }
        if (['nearest', 'angle', 'file'].includes(view.order)) orderCtl.value = view.order;
        if (Number.isFinite(Number(view.lenq))) {
            lenqCtl.value = String(Math.max(0, Math.min(100, Math.round(Number(view.lenq)))));
        }
        if (view.zaxis === 't1' || view.zaxis === 't2') zaxisCtl.value = view.zaxis;
        if (Number.isFinite(Number(view.zlo))) {
            zloCtl.value = String(Math.max(0, Math.min(100, Math.round(Number(view.zlo) * 100))));
        }
        if (Number.isFinite(Number(view.zhi))) {
            zhiCtl.value = String(Math.max(0, Math.min(100, Math.round(Number(view.zhi) * 100))));
        }
        if (parseInt(zloCtl.value, 10) > parseInt(zhiCtl.value, 10)) zloCtl.value = zhiCtl.value;
    };
    applyViewConfig(cfg.view);
    applyOrder();
    applySlices();
    applyShow();
    applyStyle();
    applySize();
    applyGlow();
    applyHeight();
    applyLenq();
    applyZRange();
    if (cfg.view && [0.5, 1, 2, 4].includes(Number(cfg.view.tourSpeed))) {
        tourSpeedCtl.value = String(Number(cfg.view.tourSpeed));
    }
    if (cfg.view && ['orbit', 'wave', 'grand', 'weave'].includes(cfg.view.tour)) {
        tourModeCtl.value = cfg.view.tour;
        tourSetPlaying(true);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
    const cloudBufSize = new THREE.Vector2();
    const renderCloud = () => {
        renderer.getDrawingBufferSize(cloudBufSize);
        if (cloudRT.width !== cloudBufSize.x || cloudRT.height !== cloudBufSize.y) {
            cloudRT.setSize(cloudBufSize.x, cloudBufSize.y);
        }
        cloudUniforms.uScale.value = cloudBufSize.y * 0.5;
        const bg = scene.background;
        scene.background = null;
        renderer.setRenderTarget(cloudRT);
        renderer.setClearColor(0x000000, 1);
        renderer.clear();
        renderer.render(scene, camera);
        renderer.setRenderTarget(null);
        renderer.render(tonemapScene, tonemapCam);
        scene.background = bg;
    };
    let lastT = performance.now();
    renderer.setAnimationLoop(() => {
        const now = performance.now();
        const dt = Math.min(0.1, (now - lastT) / 1000);
        lastT = now;
        tourTick(dt);
        flyTick(dt);
        if (controls.enabled) controls.update();
        if (styleCtl.value === 'cloud') renderCloud();
        else renderer.render(scene, camera);
    });

    window.__sculptureViewer = {
        scene, camera, renderer, points, ribbons, threads, clu: cluRibbons, sculpt, material, controls,
        flight, tour: { state: tour, tick: tourTick, pose: tourPose, setPlaying: tourSetPlaying },
        cloudMat, tonemapMat,
        count, clipped, gridN, degree,
    };
}

boot();
</script>
</body>
</html>
