        gl.uniformMatrix4fv(uProj, false, proj);
        gl.uniformMatrix4fv(uView, false, view);
        gl.clearColor(0.0196, 0.0275, 0.0471, 1);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        if (H.mode === 2) {
            gl.disable(gl.BLEND);
            gl.enable(gl.DEPTH_TEST);
            gl.depthMask(true);
        } else {
            gl.enable(gl.BLEND);
            gl.disable(gl.DEPTH_TEST);
            gl.depthMask(false);
            if (H.mode === 0) gl.blendFunc(gl.ONE, gl.ONE);
            else gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        }
        gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, n);
        frames++;
        window.__bakedSplatViewer = {
            count: n,
            frames: frames,
            mode: H.mode,
            tour: tour.mode,
            playing: tour.playing,
            fly: fly,
            cam: cam.slice(),
            target: target.slice(),
            radius: radius,
            yaw: yaw,
            pitch: pitch,
            state: function () {
                // live nav state on call — the per-frame fields above lag
                // one rendered frame and freeze when rAF throttles
                return { fly: fly, cam: cam.slice(), target: target.slice(),
                         radius: radius, yaw: yaw, pitch: pitch };
            },
            snapshotPayload: snapshotPayload
        };
        announceReady();
        requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
})();
</script>
