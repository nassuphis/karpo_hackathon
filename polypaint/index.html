<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PolyPaint Lambda</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 20px; }
h1 { color: #e94560; margin-bottom: 20px; }
.container { max-width: 900px; margin: 0 auto; }

.panel {
    background: #16213e; border-radius: 8px; padding: 16px;
    margin-bottom: 16px; border: 1px solid #0f3460;
}
.panel h2 { color: #e94560; font-size: 14px; text-transform: uppercase; margin-bottom: 12px; }

label { display: block; font-size: 13px; color: #888; margin-bottom: 4px; }
input, select {
    width: 100%; padding: 8px; border: 1px solid #0f3460; border-radius: 4px;
    background: #1a1a2e; color: #e0e0e0; font-family: monospace; font-size: 14px;
}
select { cursor: pointer; }
input[type="number"] { width: 100px; }

button {
    padding: 8px 20px; border: none; border-radius: 4px; cursor: pointer;
    font-size: 14px; font-weight: 600; margin-right: 8px; margin-top: 8px;
}
.btn-primary { background: #e94560; color: white; }
.btn-primary:hover { background: #c73e54; }
.btn-primary:disabled { background: #555; cursor: not-allowed; }
.btn-secondary { background: #0f3460; color: #e0e0e0; }

.status { font-size: 13px; color: #888; margin-top: 8px; }
.status.error { color: #e94560; }
.status.ok { color: #4ecca3; }

#job-log { font-family: monospace; font-size: 12px; max-height: 200px; overflow-y: auto; }
.log-entry { padding: 2px 0; color: #666; }
.log-entry.ok { color: #4ecca3; }
.log-entry.err { color: #e94560; }

.anim-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; font-size: 13px; }
.anim-row label { display: inline; margin: 0; min-width: 50px; }
.anim-row input { width: 70px; }

.color-dot {
    width: 10px; height: 10px; border-radius: 50%; display: inline-block;
    border: 1.5px solid #555; cursor: pointer; transition: all 0.12s;
}
.color-dot.active { background: #e94560; border-color: #e94560; }

.strat-chip {
    padding: 2px 7px; border-radius: 8px; cursor: pointer; font-size: 9px;
    text-transform: uppercase; letter-spacing: 0.06em; user-select: none;
    background: rgba(255,255,255,0.08); color: #888; border: 1px solid rgba(255,255,255,0.15);
    display: inline-block;
}
.strat-chip.active { background: #e94560; color: #000; border-color: #e94560; }

.pal-circle {
    width: 20px; height: 20px; border-radius: 50%; cursor: pointer; flex-shrink: 0;
    border: 2px solid rgba(255,255,255,0.15); box-sizing: border-box;
    transition: border-color 0.12s;
}
.pal-circle.active { border-color: #fff; }

.color-box {
    margin-top: 8px; padding: 8px; background: #1a1a2e; border-radius: 4px;
    border: 1px solid #0f3460;
}
.color-title {
    font-size: 11px; font-weight: 600; color: #e94560; text-transform: uppercase;
    margin-bottom: 6px;
}
.color-row {
    display: flex; gap: 8px; align-items: center; margin-bottom: 4px; font-size: 10px;
}
.color-row-label { color: #666; min-width: 45px; text-transform: uppercase; letter-spacing: 0.06em; }

.tab-bar { display: flex; gap: 0; margin-bottom: 0; }
.tab-btn {
    padding: 8px 20px; font-size: 13px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.06em; cursor: pointer; border: 1px solid #0f3460;
    border-bottom: none; border-radius: 8px 8px 0 0; background: #1a1a2e; color: #666;
}
.tab-btn.active { background: #16213e; color: #e94560; }
.tab-content { display: none; }
.tab-content.active { display: block; }

#results-tbody tr { cursor: pointer; transition: background 0.1s; }
#results-tbody tr:hover { background: rgba(233, 69, 96, 0.1); }
#results-tbody tr.selected { background: rgba(233, 69, 96, 0.25); }
#results-tbody td { padding: 3px 6px; border-bottom: 1px solid #0f3460; white-space: nowrap; }
</style>
</head>
<body>
<div class="container">
    <h1>PolyPaint Lambda</h1>

    <!-- Config -->
    <div class="panel">
        <h2>Configuration</h2>
        <label>Config URL (config.json)</label>
        <div style="display:flex; gap:8px; align-items:center">
            <input type="text" id="config-url" value="http://polypaint.s3-website-us-east-1.amazonaws.com/config.json" style="flex:1">
            <button onclick="loadLambdaConfig()" class="btn-secondary" style="padding:4px 12px">Load</button>
            <span id="config-status" style="font-size:11px; color:#888"></span>
        </div>
    </div>

    <div class="tab-bar">
        <div class="tab-btn active" onclick="switchTab('compute')">Compute</div>
        <div class="tab-btn" onclick="switchTab('results')">Results</div>
        <div class="tab-btn" onclick="switchTab('render')">Render</div>
    </div>
    <div class="panel" style="border-radius:0 8px 8px 8px">
        <!-- Compute tab -->
        <div id="tab-compute" class="tab-content active">
            <div class="anim-row">
                <label>Function:</label>
                <select id="render-function">
                    <option value="giga_1">giga_1 (degree 24)</option>
                    <option value="rev_giga_1">rev_giga_1 (reversed)</option>
                    <option value="giga_5">giga_5 (degree 25)</option>
                    <option value="rev_giga_5">rev_giga_5 (reversed)</option>
                    <option value="giga_19">giga_19 (degree 89)</option>
                    <option value="rev_giga_19">rev_giga_19 (reversed)</option>
                    <option value="giga_42">giga_42 (degree 49)</option>
                    <option value="rev_giga_42">rev_giga_42 (reversed)</option>
                    <option value="giga_43">giga_43 (degree 39)</option>
                    <option value="rev_giga_43">rev_giga_43 (reversed)</option>
                    <option value="giga_87">giga_87 (degree 50)</option>
                    <option value="rev_giga_87">rev_giga_87 (reversed)</option>
                    <option value="giga_30">giga_30 (degree 9)</option>
                    <option value="rev_giga_30">rev_giga_30 (reversed)</option>
                    <option value="giga_39">giga_39 (degree 49)</option>
                    <option value="rev_giga_39">rev_giga_39 (reversed)</option>
                    <option value="giga_40">giga_40 (degree 34)</option>
                    <option value="rev_giga_40">rev_giga_40 (reversed)</option>
                    <option value="p7f">p7f (degree 22)</option>
                    <option value="rev_p7f">rev_p7f (reversed)</option>
                    <option value="poly_110">poly_110 (degree 70)</option>
                    <option value="rev_poly_110">rev_poly_110 (reversed)</option>
                    <option value="giga_227">giga_227 (degree 24)</option>
                    <option value="rev_giga_227">rev_giga_227 (reversed)</option>
                    <option value="giga_230">giga_230 (degree 9)</option>
                    <option value="rev_giga_230">rev_giga_230 (reversed)</option>
                    <option value="giga_232">giga_232 (degree 8)</option>
                    <option value="rev_giga_232">rev_giga_232 (reversed)</option>
                </select>
            </div>
            <div class="anim-row" style="margin-top:8px">
                <label>N (grid):</label>
                <input type="number" id="render-n" value="500" min="10" max="5000" step="10">
                <label>Stripes:</label>
                <input type="number" id="render-stripes" value="10" min="10" max="500" step="1">
            </div>
            <div style="margin-top:8px">
                <button class="btn-primary" id="btn-calculate" onclick="runCalculate()" style="background:#2a6">Calculate</button>
                <button class="btn-secondary" onclick="loadRenderPreset('fast')">Fast N=100</button>
                <button class="btn-secondary" onclick="loadRenderPreset('medium')">Medium N=500</button>
                <button class="btn-secondary" onclick="loadRenderPreset('hires')">Hi-res N=1K</button>
            </div>
            <div class="anim-row" style="margin-top:8px">
                <label>Results Dir:</label>
                <input type="text" id="results-dir" placeholder="auto-populated after Calculate" style="flex:1; font-family:monospace; font-size:12px">
            </div>
            <div class="status" id="compute-status"></div>
            <div id="compute-log" style="margin-top:8px; max-height:200px; overflow-y:auto; font-family:monospace; font-size:12px"></div>
        </div>

        <!-- Results tab -->
        <div id="tab-results" class="tab-content">
            <div style="display:flex; gap:12px; height:420px">
                <!-- Left: scrollable table -->
                <div style="flex:1; min-width:0; display:flex; flex-direction:column">
                    <div style="margin-bottom:6px; display:flex; align-items:center; gap:8px">
                        <button class="btn-secondary" onclick="loadResults()" style="margin:0; padding:4px 12px">Refresh</button>
                        <span id="results-count" style="font-size:11px; color:#666"></span>
                    </div>
                    <div id="results-scroll" tabindex="0" style="flex:1; overflow-y:auto; border:1px solid #0f3460; border-radius:4px; outline:none">
                        <table style="width:100%; border-collapse:collapse; font-size:11px; font-family:monospace">
                            <thead>
                                <tr style="background:#1a1a2e; position:sticky; top:0; z-index:1">
                                    <th style="text-align:left; padding:4px 6px; color:#888; border-bottom:1px solid #0f3460">Job ID</th>
                                    <th style="text-align:left; padding:4px 6px; color:#888; border-bottom:1px solid #0f3460">Function</th>
                                    <th style="text-align:right; padding:4px 6px; color:#888; border-bottom:1px solid #0f3460">Deg</th>
                                    <th style="text-align:right; padding:4px 6px; color:#888; border-bottom:1px solid #0f3460">N</th>
                                    <th style="text-align:right; padding:4px 6px; color:#888; border-bottom:1px solid #0f3460">Str</th>
                                    <th style="text-align:right; padding:4px 6px; color:#888; border-bottom:1px solid #0f3460">Size</th>
                                </tr>
                            </thead>
                            <tbody id="results-tbody"></tbody>
                        </table>
                    </div>
                </div>
                <!-- Right: buttons + preview thumbnail -->
                <div style="width:200px; flex-shrink:0; display:flex; flex-direction:column">
                    <div style="font-size:11px; margin-bottom:4px">
                        <label>Quantile <span id="res-q-val">0</span>%</label>
                        <input type="range" id="res-quantile" min="0" max="10" step="0.5" value="0"
                               style="width:100%" oninput="document.getElementById('res-q-val').textContent=this.value">
                        <label>Shim <span id="res-s-val">5</span>%</label>
                        <input type="range" id="res-shim" min="0" max="50" step="1" value="5"
                               style="width:100%" oninput="document.getElementById('res-s-val').textContent=this.value">
                    </div>
                    <div style="display:flex; gap:6px; margin-bottom:8px">
                        <button class="btn-primary" id="btn-preview" onclick="previewResult()" disabled
                                style="margin:0; padding:4px 12px; font-size:12px">Preview</button>
                        <button class="btn-primary" id="btn-render-result" onclick="renderResult()" disabled
                                style="margin:0; padding:4px 12px; font-size:12px; background:#2a6">Render</button>
                        <button class="btn-secondary" id="btn-delete" onclick="deleteResult()" disabled
                                style="margin:0; padding:4px 12px; font-size:12px; background:#6b2030">Delete</button>
                    </div>
                    <div id="results-preview" style="flex:1; display:flex; align-items:center; justify-content:center;
                         border:1px solid #0f3460; border-radius:4px; background:#1a1a2e; overflow:hidden">
                        <span style="color:#444; font-size:11px">No preview</span>
                    </div>
                    <div id="results-info" style="font-size:10px; color:#666; margin-top:4px; line-height:1.4"></div>
                </div>
            </div>
        </div>

        <!-- Render tab -->
        <div id="tab-render" class="tab-content">
            <div class="anim-row">
                <label>Results Dir:</label>
                <input type="text" id="render-results-dir" placeholder="populate via Compute tab or enter job_id" style="flex:1; font-family:monospace; font-size:12px">
            </div>
            <div class="anim-row" style="margin-top:8px">
                <label style="display:inline-block;min-width:100px">Quantile: <span id="render-quantile-val" style="display:inline-block;width:2.5em;text-align:right">0.0</span>%</label>
                <input type="range" id="render-quantile" min="0" max="3" step="0.1" value="0" style="width:200px" oninput="document.getElementById('render-quantile-val').textContent=parseFloat(this.value).toFixed(1)">
                <label style="display:inline-block;min-width:80px;margin-left:12px">Shim: <span id="render-shim-val" style="display:inline-block;width:2.5em;text-align:right">5.0</span>%</label>
                <input type="range" id="render-shim" min="0" max="10" step="0.1" value="5.0" style="width:200px" oninput="document.getElementById('render-shim-val').textContent=parseFloat(this.value).toFixed(1)">
            </div>
            <div class="anim-row" style="margin-top:8px">
                <label>Pix (image):</label>
                <input type="number" id="render-pix" value="4096" min="256" max="100000" step="256" style="width:7em">
                <label>Format:</label>
                <select id="render-format" style="width:5em">
                    <option value="jpeg">JPEG</option>
                    <option value="png">PNG</option>
                </select>
                <label>Quality:</label>
                <input type="number" id="render-quality" value="90" min="1" max="100" step="5">
            </div>
            <!-- Color controls -->
            <div class="color-box">
                <div class="color-title">Color</div>
                <div class="color-row">
                    <span class="color-dot active" data-mode="rainbow" onclick="setColorMode('rainbow')"></span>
                    <span style="color:#aaa; cursor:pointer; letter-spacing:0.06em; text-transform:uppercase" onclick="setColorMode('rainbow')">Rainbow</span>
                    <div id="rainbow-options" style="display:inline-flex; gap:6px; margin-left:12px">
                        <span class="color-row-label">Match:</span>
                        <span class="strat-chip active" data-match="none" onclick="setMatch('none')">None</span>
                        <span class="strat-chip" data-match="greedy" onclick="setMatch('greedy')">Greedy</span>
                        <span class="strat-chip" data-match="hungarian" onclick="setMatch('hungarian')">Hungarian</span>
                    </div>
                </div>
                <div class="color-row">
                    <span class="color-dot" data-mode="proximity" onclick="setColorMode('proximity')"></span>
                    <span style="color:#888; cursor:pointer; letter-spacing:0.06em; text-transform:uppercase" onclick="setColorMode('proximity')">Proximity</span>
                    <div id="proximity-options" style="display:none; margin-left:12px">
                        <span class="color-row-label">Palette:</span>
                        <div id="palette-circles" style="display:inline-flex; gap:4px; flex-wrap:wrap"></div>
                    </div>
                </div>
                <div class="color-row">
                    <span class="color-dot" data-mode="constant" onclick="setColorMode('constant')"></span>
                    <span style="color:#888; cursor:pointer; letter-spacing:0.06em; text-transform:uppercase" onclick="setColorMode('constant')">Constant</span>
                    <span id="constant-options" style="display:none; margin-left:12px">
                        <span id="constant-color-swatch" onclick="document.getElementById('render-constant-color').click()"
                            style="display:inline-block; width:24px; height:24px; border-radius:4px; border:2px solid #666; cursor:pointer; vertical-align:middle; background:#ffffff; box-shadow:0 0 0 1px #333 inset"></span>
                        <input type="color" id="render-constant-color" value="#ffffff"
                            style="position:absolute; opacity:0; width:0; height:0; pointer-events:none"
                            oninput="document.getElementById('constant-color-swatch').style.background=this.value">
                    </span>
                </div>
                <div class="color-row" style="margin-top:4px">
                    <span class="color-row-label" style="min-width:80px">Gamma: <span id="render-gamma-val" style="display:inline-block;width:2em;text-align:right">2.2</span></span>
                    <input type="range" id="render-gamma" min="0" max="3" step="0.1" value="2.2" style="width:150px"
                        oninput="document.getElementById('render-gamma-val').textContent=parseFloat(this.value).toFixed(1)">
                    <span style="color:#555; font-size:9px">(0=raw add)</span>
                </div>
            </div>
            <div class="color-row" style="margin-top:4px">
                <span class="color-row-label" style="min-width:80px">Tile size:</span>
                <select id="sparse-tile-size" style="font-size:12px; background:#1a1a2e; color:#ccc; border:1px solid #333; padding:2px 4px">
                    <option value="2048">2048</option>
                    <option value="4096" selected>4096</option>
                    <option value="8192">8192</option>
                </select>
            </div>
            <div style="margin-top:8px; display:flex; gap:6px; align-items:center">
                <button class="btn-primary" id="btn-raster-all" onclick="runRasterPipeline()">Render</button>
            </div>
            <div class="status" id="render-status"></div>
            <div id="render-preview" style="max-width:600px; margin-top:8px"></div>
            <div id="render-info" style="font-size:12px; color:#888; margin-top:4px"></div>
            <div id="render-log" style="margin-top:8px"></div>
        </div>
    </div>
</div>

<script>
/* ---- Logging ---- */
function log(msg, cls='', target='compute-log') {
    const el = document.getElementById(target);
    if (!el) return;
    const d = document.createElement('div');
    d.className = 'log-entry ' + cls;
    d.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    el.prepend(d);
    // Cap at 500 entries
    while (el.children.length > 500) el.removeChild(el.lastChild);
}

/* ---- Tabs ---- */
function switchTab(name) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.textContent.toLowerCase() === name));
    document.querySelectorAll('.tab-content').forEach(t => t.classList.toggle('active', t.id === 'tab-' + name));
    if (name === 'results') loadResults();
}

/* ---- Results management ---- */
let _resultsCache = [];      // last fetched results
let _selectedJobId = null;   // currently selected job_id
let _resultsLoading = false;

async function loadResults() {
    if (_resultsLoading) return;
    _resultsLoading = true;
    const countEl = document.getElementById('results-count');
    countEl.textContent = 'Loading...';

    try {
        const data = await lambdaPost('storage', {}, '/list');
        _resultsCache = data.results || [];
        renderResultsTable();
        countEl.textContent = `${data.count} results (${(data.list_us/1e6).toFixed(1)}s)`;
    } catch (e) {
        countEl.textContent = 'Error: ' + e.message;
    } finally {
        _resultsLoading = false;
    }
}

function renderResultsTable() {
    const tbody = document.getElementById('results-tbody');
    tbody.innerHTML = '';
    const fmtSize = (b) => b > 1e6 ? (b/1e6).toFixed(1)+'M' : (b/1e3).toFixed(0)+'K';

    for (const r of _resultsCache) {
        const tr = document.createElement('tr');
        if (r.job_id === _selectedJobId) tr.className = 'selected';
        tr.onclick = () => selectResult(r.job_id);

        // Short ID: strip "compute_" prefix
        const shortId = r.job_id.replace(/^compute_/, '');
        const indicators = (r.has_preview ? '\u25cf' : '\u25cb') + (r.has_image ? '\u2713' : '');

        tr.innerHTML =
            `<td style="color:#e0e0e0">${shortId} <span style="color:#555;font-size:9px">${indicators}</span></td>` +
            `<td style="color:#4ecca3">${r.function || '?'}</td>` +
            `<td style="text-align:right">${r.degree || ''}</td>` +
            `<td style="text-align:right">${r.n1 || ''}</td>` +
            `<td style="text-align:right">${r.n_stripes || ''}</td>` +
            `<td style="text-align:right;color:#888">${fmtSize(r.total_size || 0)}</td>`;
        tbody.appendChild(tr);
    }
}

function selectResult(jobId) {
    _selectedJobId = jobId;

    // Update selection highlight
    document.querySelectorAll('#results-tbody tr').forEach(tr => tr.classList.remove('selected'));
    const rows = document.querySelectorAll('#results-tbody tr');
    const idx = _resultsCache.findIndex(r => r.job_id === jobId);
    if (idx >= 0 && rows[idx]) {
        rows[idx].classList.add('selected');
        rows[idx].scrollIntoView({ block: 'nearest' });
    }

    // Focus the scroll container so arrow keys work
    document.getElementById('results-scroll').focus();

    // Enable buttons
    document.getElementById('btn-preview').disabled = false;
    document.getElementById('btn-render-result').disabled = false;
    document.getElementById('btn-delete').disabled = false;

    // Populate render-results-dir for easy render access
    document.getElementById('render-results-dir').value = jobId;
    document.getElementById('results-dir').value = jobId;

    // Show cached preview if available
    const r = _resultsCache.find(r => r.job_id === jobId);
    const previewEl = document.getElementById('results-preview');
    const infoEl = document.getElementById('results-info');

    if (r && r.has_preview && r.preview_url) {
        previewEl.innerHTML = `<img src="${r.preview_url}" style="max-width:100%; max-height:100%; image-rendering:pixelated">`;
    } else {
        previewEl.innerHTML = '<span style="color:#444; font-size:11px">No preview</span>';
    }

    if (r) {
        infoEl.textContent = `${r.function || '?'} deg${r.degree || '?'} N=${r.n1||'?'} ${r.n_stripes||'?'}str ${r.file_count||'?'} files`;
    }
}

document.addEventListener('keydown', (e) => {
    if (!document.getElementById('tab-results').classList.contains('active')) return;
    if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
    if (!_resultsCache.length) return;
    e.preventDefault();

    const idx = _selectedJobId ? _resultsCache.findIndex(r => r.job_id === _selectedJobId) : -1;
    let next;
    if (e.key === 'ArrowDown') {
        next = idx < _resultsCache.length - 1 ? idx + 1 : idx;
    } else {
        next = idx > 0 ? idx - 1 : 0;
    }
    selectResult(_resultsCache[next].job_id);
});

async function previewResult() {
    if (!_selectedJobId) return;
    const btn = document.getElementById('btn-preview');
    btn.disabled = true;
    btn.textContent = '...';
    const infoEl = document.getElementById('results-info');
    const t0 = performance.now();

    try {
        const quantile = parseFloat(document.getElementById('res-quantile').value) / 100;
        const shim = parseFloat(document.getElementById('res-shim').value) / 100;
        const previewSize = 256;

        // Step 1: viewport
        infoEl.textContent = 'Computing viewport...';
        const vp = await lambdaPost('viewport', {
            job_id: _selectedJobId, quantile, shim,
        });

        // Get degree from results cache
        let calcResult = _resultsCache.find(r => r.job_id === _selectedJobId);
        if (!calcResult) {
            await lambdaPost('storage', {}, '/list');
            calcResult = _resultsCache.find(r => r.job_id === _selectedJobId);
        }
        const degree = (calcResult && calcResult.degree) || 1;
        const REF_SIZE = 4096;
        const scale = vp.scale_ref * previewSize / REF_SIZE;

        // Step 2: render lores at small size
        infoEl.textContent = 'Rendering preview...';
        const loresKey = `renders/${_selectedJobId}/lores.bin`;
        const renderResult = await lambdaPost('render', {
            job_id: _selectedJobId,
            stripe_idx: 0,
            bin_key: loresKey,
            width: previewSize, height: previewSize,
            center_re: vp.center_re, center_im: vp.center_im,
            scale: scale, degree: degree,
            color: 'rainbow', match: 'none',
            palette: 'inferno', constant_color: 'ffffff',
        });

        // Step 3: encode to JPEG
        infoEl.textContent = 'Encoding preview...';
        const previewKey = `renders/${_selectedJobId}/preview.jpg`;
        const encResult = await lambdaPost('encode', {
            raw_key: renderResult.s3_key,
            out_key: previewKey,
            format: 'jpeg', quality: 80,
        });

        // Cleanup temp .raw
        lambdaPost('storage', { keys: [renderResult.s3_key] }, '/cleanup').catch(() => {});

        const totalMs = (performance.now() - t0).toFixed(0);

        // Update cache
        const r = _resultsCache.find(r => r.job_id === _selectedJobId);
        if (r) {
            r.has_preview = true;
            r.preview_url = encResult.image_url;
        }

        // Show preview

            `<img src="${encResult.image_url}" style="max-width:100%; max-height:100%; image-rendering:pixelated">`;
        infoEl.textContent += ` | preview ${(totalMs/1000).toFixed(1)}s`;

        renderResultsTable();
    } catch (e) {
        infoEl.textContent = 'Preview error: ' + e.message;
    } finally {
        btn.disabled = false;
        btn.textContent = 'Preview';
    }
}

async function loadLambdaConfig() {

function lambdaUrl(name, path) {
    const base = (_lambdaUrls[name] || '').replace(/\/$/, '');
    if (!base) throw new Error(`Lambda URL not configured for "${name}". Load config.json first.`);
    return base + (path || '');
}

// Helper: POST JSON to a Lambda and parse response
async function lambdaPost(name, body, path) {
    const url = lambdaUrl(name, path);
    const opts = { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
    for (let attempt = 0; attempt < 5; attempt++) {
        let resp;
        try {
            resp = await fetch(url, opts);
        } catch (e) {
            // Network-level failure (Failed to fetch) — retry with backoff
            if (attempt < 4) {
                const delay = 1000 * Math.pow(2, attempt) + Math.random() * 1000;
                await new Promise(r => setTimeout(r, delay));
                continue;
            }
            throw e;
        }
        if (resp.status === 503 || resp.status === 429) {
            const delay = 1000 * Math.pow(2, attempt) + Math.random() * 1000;
            await new Promise(r => setTimeout(r, delay));
            continue;
        }
        if (!resp.ok) throw new Error(`${name} HTTP ${resp.status}: ${await resp.text()}`);
        const raw = await resp.json();
        return typeof raw.body === 'string' ? JSON.parse(raw.body) : raw;
    }
    throw new Error(`${name}: failed after 5 retries`);
}

// Download a file via presigned URL with Content-Disposition: attachment
// Gets a new presigned URL with download filename baked in, then navigates to it.
async function downloadPresignedFile(originalUrl, filename) {
    const btn = event && event.target;
    const origText = btn ? btn.textContent : '';
    if (btn) { btn.disabled = true; btn.textContent = 'Preparing download...'; }
    try {
        // Re-presign with Content-Disposition: attachment so browser saves instead of displaying
        const key = _lastDownloadKey;
        if (key) {
            const result = await lambdaPost('storage', { key, filename }, '/presign');
            window.location.href = result.url;
        } else {
            // Fallback: use <a download> trick
            const a = document.createElement('a');
            a.href = originalUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    } catch (e) {
        alert('Download failed: ' + e.message);
    } finally {
        if (btn) { btn.disabled = false; btn.textContent = origText; }
    }
}
let _lastDownloadKey = null;

// Concurrency-limited parallel execution (prevents browser connection exhaustion)
async function asyncPool(limit, items, fn) {
    const results = [];
    const executing = new Set();
    for (const item of items) {
        const p = fn(item).then(r => { executing.delete(p); return r; });
        executing.add(p);
        results.push(p);
        if (executing.size >= limit) await Promise.race(executing);
    }
    return Promise.all(results);
}

async function runRasterPipeline() {
    const btn = document.getElementById('btn-raster-all');
    btn.disabled = true;
    document.getElementById('render-preview').innerHTML = '';
    document.getElementById('render-info').textContent = '';

    try {
        const p = _renderCommonParams();
        const tileSize = p.tileSize;
        const nTileCols = Math.ceil(p.pix / tileSize);
        const nTileRows = Math.ceil(p.pix / tileSize);
        const nTiles = nTileCols * nTileRows;
        const colorDesc = renderColorMode === 'constant' ? `constant/#${p.constantColor}` :
            renderColorMode === 'proximity' ? `proximity/${renderPalette}` : `rainbow/${renderMatchMode}`;

        // Clean up old render artifacts (.raw/.jpeg/.png/.pix), preserve .bin
        document.getElementById('render-status').textContent = `Cleaning old render files...`;
        document.getElementById('render-status').className = 'status';
        const cleanResult = await lambdaPost('storage', { job_id: p.jobId }, '/clean-render');
        if (cleanResult.deleted > 0)
            log(`  cleaned ${cleanResult.deleted} old render files`, '', 'render-log');

        // Phase 1: viewport
        document.getElementById('render-status').textContent = `Computing viewport...`;
        log(`Viewport: ${p.jobId}, quantile=${(p.quantile*100).toFixed(1)}%, shim=${(p.shim*100).toFixed(1)}%...`, '', 'render-log');

        const tVp = performance.now();
        const vpData = await lambdaPost('viewport', { job_id: p.jobId, quantile: p.quantile, shim: p.shim });
        log(`  viewport: ${_fmtMs(performance.now()-tVp)} | ${vpData.n_roots} roots`, 'ok', 'render-log');

        const REF_SIZE = 4096;
        const scale = vpData.scale_ref * Math.min(p.pix, p.pix) / REF_SIZE;

        let calcMeta = _lastCalcMeta && _lastCalcMeta.job_id === p.jobId ? _lastCalcMeta : null;
        if (!calcMeta) {
            const listData = await lambdaPost('storage', {}, '/list');
            const jobResult = (listData.results || []).find(r => r.job_id === p.jobId);
            if (!jobResult) throw new Error('Job not found in results');
            calcMeta = { n_stripes: jobResult.n_stripes || 10, degree: jobResult.degree || 1 };
        }
        const nStripes = calcMeta.n_stripes;

        // Phase 2: Raster — one Lambda per compute stripe
        const rasterJobs = [];
        for (let s = 0; s < nStripes; s++) {
            rasterJobs.push({
                job_id: p.jobId, stripe_idx: s,
                bin_key: `renders/${p.jobId}/stripe_${s}.bin`,
                width: p.pix, height: p.pix,
                tile_size: tileSize,
                n_tile_cols: nTileCols, n_tile_rows: nTileRows,
                center_re: vpData.center_re, center_im: vpData.center_im,
                scale, degree: calcMeta.degree,
                color: renderColorMode, match: renderMatchMode,
                palette: renderPalette, constant_color: p.constantColor,
            });
        }

        log(`Raster: ${p.jobId}, ${p.pix}px ${p.fmt}, ${colorDesc}, ${nStripes} stripes, ${nTileCols}x${nTileRows}=${nTiles} tiles (${tileSize}px)...`, '', 'render-log');
        document.getElementById('render-status').textContent = `Dispatching ${nStripes} raster Lambdas...`;
        const tRaster = performance.now();

        // Dispatch raster Lambdas in batches
        const BATCH_SIZE = 500;
        const nBatches = Math.ceil(rasterJobs.length / BATCH_SIZE);
        for (let i = 0; i < rasterJobs.length; i += BATCH_SIZE) {
            const batchNum = Math.floor(i / BATCH_SIZE) + 1;
            const batch = rasterJobs.slice(i, i + BATCH_SIZE);
            document.getElementById('render-status').textContent = `Dispatching raster batch ${batchNum}/${nBatches} (${batch.length} jobs)...`;
            const tBatch = performance.now();
            // Raster jobs don't produce simple expected keys — pass empty to skip key derivation
            const dispResult = await lambdaPost('dispatch', { target: 'raster', jobs: batch, expected_keys: [] });
            if ((dispResult.fired || 0) !== batch.length || (dispResult.errors && dispResult.errors.length)) {
                throw new Error(
                    `Raster dispatch failed batch ${batchNum}: ` +
                    `fired ${dispResult.fired || 0}/${batch.length}, ` +
                    `errors ${dispResult.errors ? dispResult.errors.length : 0}`
                );
            }
            log(`  raster dispatch ${batchNum}/${nBatches}: ${dispResult.fired}/${batch.length} fired (${_fmtMs(performance.now() - tBatch)})`, '', 'render-log');
        }
        log(`  dispatched: ${_fmtMs(performance.now() - tRaster)} (${nStripes} raster Lambdas)`, 'ok', 'render-log');

        // Poll DynamoDB for raster completion
        let lastDone = 0;
        let pollCount = 0;
        let lastProgressTime = performance.now();
        const POLL_TIMEOUT_MS = 600000;
        while (true) {
            await new Promise(r => setTimeout(r, 3000));
            pollCount++;
            const check = await lambdaPost('storage', {
                job_id: p.jobId, task_prefix: 'raster_', expected: nStripes,
            }, '/check-status');
            if (check.errors > 0) {
                const msgs = check.error_details.map(e => e.task_id + ': ' + e.error_msg).join('\n');
                throw new Error(`${check.errors} raster tasks failed:\n${msgs}`);
            }
            if (check.done !== lastDone) {
                const delta = check.done - lastDone;
                log(`  raster poll #${pollCount}: ${check.done}/${nStripes} done (+${delta}, ${_fmtMs(performance.now() - tRaster)})`, '', 'render-log');
                lastDone = check.done;
                lastProgressTime = performance.now();
                document.getElementById('render-status').textContent = `Rasterizing ${check.done}/${nStripes}...`;
            }
            if (check.complete) break;
            if (performance.now() - lastProgressTime > POLL_TIMEOUT_MS) {
                throw new Error(`Raster stalled: ${lastDone}/${nStripes} after ${_fmtMs(performance.now() - tRaster)}`);
            }
        }
        const rasterMs = performance.now() - tRaster;
        log(`  raster: ${_fmtMs(rasterMs)} wall (${nStripes} stripes)`, 'ok', 'render-log');

        // Phase 3: Finalize — one Lambda per tile
        const finalizeJobs = [];
        const tileKeys = [];
        for (let t = 0; t < nTiles; t++) {
            const tRow = Math.floor(t / nTileCols);
            const tCol = t % nTileCols;
            const tw = Math.min(tileSize, p.pix - tCol * tileSize);
            const th = Math.min(tileSize, p.pix - tRow * tileSize);
            finalizeJobs.push({
                job_id: p.jobId, tile_idx: t, n_stripes: nStripes,
                tile_w: tw, tile_h: th,
            });
            tileKeys.push(`renders/${p.jobId}/tile_${String(t).padStart(4, '0')}.raw`);
        }

        log(`Finalize: ${nTiles} tiles (${nTileCols}x${nTileRows})...`, '', 'render-log');
        document.getElementById('render-status').textContent = `Dispatching ${nTiles} finalize Lambdas...`;
        const tFinalize = performance.now();

        // Dispatch finalize Lambdas
        const finBatches = Math.ceil(finalizeJobs.length / BATCH_SIZE);
        for (let i = 0; i < finalizeJobs.length; i += BATCH_SIZE) {
            const batchNum = Math.floor(i / BATCH_SIZE) + 1;
            const batch = finalizeJobs.slice(i, i + BATCH_SIZE);
            const dispResult = await lambdaPost('dispatch', { target: 'finalize', jobs: batch, expected_keys: [] });
            if ((dispResult.fired || 0) !== batch.length || (dispResult.errors && dispResult.errors.length)) {
                throw new Error(
                    `Finalize dispatch failed batch ${batchNum}: ` +
                    `fired ${dispResult.fired || 0}/${batch.length}`
                );
            }
            log(`  finalize dispatch ${batchNum}/${finBatches}: ${dispResult.fired}/${batch.length} fired`, '', 'render-log');
        }

        // Poll DynamoDB for finalize completion
        let finLastDone = 0;
        let finPollCount = 0;
        let finLastProgress = performance.now();
        while (true) {
            await new Promise(r => setTimeout(r, 3000));
            finPollCount++;
            const check = await lambdaPost('storage', {
                job_id: p.jobId, task_prefix: 'tile_', expected: nTiles,
            }, '/check-status');
            if (check.errors > 0) {
                const msgs = check.error_details.map(e => e.task_id + ': ' + e.error_msg).join('\n');
                throw new Error(`${check.errors} finalize tasks failed:\n${msgs}`);
            }
            if (check.done !== finLastDone) {
                const delta = check.done - finLastDone;
                log(`  finalize poll #${finPollCount}: ${check.done}/${nTiles} done (+${delta}, ${_fmtMs(performance.now() - tFinalize)})`, '', 'render-log');
                finLastDone = check.done;
                finLastProgress = performance.now();
                document.getElementById('render-status').textContent = `Finalizing ${check.done}/${nTiles} tiles...`;
            }
            if (check.complete) break;
            if (performance.now() - finLastProgress > POLL_TIMEOUT_MS) {
                throw new Error(`Finalize stalled: ${finLastDone}/${nTiles} after ${_fmtMs(performance.now() - tFinalize)}`);
            }
        }
        const finalizeMs = performance.now() - tFinalize;
        log(`  finalize: ${_fmtMs(finalizeMs)} wall (${nTiles} tiles)`, 'ok', 'render-log');

        // Phase 4: Encode — dispatch async, poll for completion
        const ext = p.fmt !== 'png' ? 'jpeg' : 'png';
        document.getElementById('render-status').textContent = `Dispatching encode (${ext})...`;
        const tEncode = performance.now();
        const imageKey = `renders/${p.jobId}/image.${ext}`;
        const encodeJob = {
            job_id: p.jobId,
            out_key: imageKey, format: ext, quality: p.quality,
            width: p.pix, height: p.pix,
            tile_grid: {
                n_cols: nTileCols, n_rows: nTileRows,
                tile_size: tileSize, tile_keys: tileKeys,
            },
        };

        // Dispatch encode Lambda asynchronously
        const encDispResult = await lambdaPost('dispatch', { target: 'encode', jobs: [encodeJob], expected_keys: [] });
        if ((encDispResult.fired || 0) !== 1) {
            throw new Error(`Encode dispatch failed: fired ${encDispResult.fired || 0}/1`);
        }
        log(`  encode dispatched (${ext})`, '', 'render-log');

        // Poll DynamoDB for encode completion
        let encPollCount = 0;
        let encLastProgress = performance.now();
        while (true) {
            await new Promise(r => setTimeout(r, 3000));
            encPollCount++;
            const check = await lambdaPost('storage', {
                job_id: p.jobId, task_prefix: 'encode', expected: 1,
            }, '/check-status');
            if (check.errors > 0) {
                const msgs = check.error_details.map(e => e.task_id + ': ' + e.error_msg).join('\n');
                throw new Error(`Encode failed:\n${msgs}`);
            }
            const statusStr = check.status_counts ? Object.entries(check.status_counts).map(([k,v]) => k).join('/') : '';
            if (statusStr && encPollCount % 3 === 0) {
                document.getElementById('render-status').textContent = `Encoding... (${statusStr})`;
            }
            if (check.complete) break;
            if (performance.now() - encLastProgress > POLL_TIMEOUT_MS) {
                throw new Error(`Encode stalled after ${_fmtMs(performance.now() - tEncode)}`);
            }
        }
        const encodeMs = performance.now() - tEncode;

        // Get presigned URL for the encoded image
        const presignResult = await lambdaPost('storage', { key: imageKey }, '/presign');
        const imageUrl = presignResult.url;
        _lastDownloadKey = imageKey;
        log(`  encode: ${_fmtMs(encodeMs)} (${ext})`, 'ok', 'render-log');

        // Cleanup .pix and tile .raw files (fire-and-forget)
        const cleanupKeys = [...tileKeys];
        lambdaPost('storage', { keys: cleanupKeys }, '/cleanup').catch(() => {});

        // Show results
        const totalMs = performance.now() - tVp;
        const statusParts = [
            nStripes + ' stripes',
            nTiles + ' tiles',
            'raster ' + _fmtMs(rasterMs),
            'finalize ' + _fmtMs(finalizeMs),
            'encode ' + _fmtMs(encodeMs),
            ext,
        ];
        document.getElementById('render-status').textContent = statusParts.join(' | ');
        document.getElementById('render-status').className = 'status ok';

        const preview = document.getElementById('render-preview');
        if (p.pix > 5000) {
            // Too large for browser preview — download-only
            preview.innerHTML = `<div style="padding:20px; text-align:center; background:#1a1a2e; border:1px solid #333; border-radius:8px">` +
                `<div style="color:#aaa; margin-bottom:12px">${p.pix}x${p.pix} image — too large to preview in browser</div>` +
                `<button class="btn-primary" onclick="downloadPresignedFile('${imageUrl}', '${p.jobId}_${p.pix}px.${ext}')" ` +
                `style="padding:8px 24px; font-size:14px">Download ${ext.toUpperCase()}</button></div>`;
        } else {
            preview.innerHTML = `<a href="${imageUrl}" target="_blank" title="Click to open full-size image">` +
                `<img src="${imageUrl}" style="max-width:100%; border:1px solid #333; cursor:pointer"></a>` +
                `<div style="margin-top:8px"><button class="btn-secondary" onclick="downloadPresignedFile('${imageUrl}', '${p.jobId}_${p.pix}px.${ext}')" ` +
                `style="padding:4px 12px">Download ${ext.toUpperCase()}</button></div>`;
        }

        document.getElementById('render-info').textContent =
            `Job: ${p.jobId} | ${p.pix}x${p.pix} | Degree: ${calcMeta.degree} | Sparse pipeline`;

        log(`Done: deg${calcMeta.degree} ${p.pix}px, ${nStripes} stripes, ${nTiles} tiles, total ${_fmtMs(totalMs)}`, 'ok', 'render-log');

    } catch (e) {
        document.getElementById('render-status').textContent = 'Render error: ' + e.message;
        document.getElementById('render-status').className = 'status error';
        log(`Render failed: ${e.message}`, 'err', 'render-log');
    } finally {
        btn.disabled = false;
    }
}

let _lastCalcMeta = null;  // cache last compute metadata for render

async function runCalculate() {
    const funcName = document.getElementById('render-function').value;
    const n = parseInt(document.getElementById('render-n').value);
    const nStripes = Math.max(10, parseInt(document.getElementById('render-stripes').value) || 10);
    const jobId = 'compute_' + Date.now().toString(36);

    const btn = document.getElementById('btn-calculate');
    btn.disabled = true;
    document.getElementById('compute-status').textContent = `Computing ${funcName} N=${n}, stripes=${nStripes}...`;
    document.getElementById('compute-status').className = 'status';
    log(`Compute: ${funcName} N=${n}, stripes=${nStripes}...`);
    const fmtMs = (ms) => (ms/1000).toFixed(1) + 's';

    try {
        const tTotal = performance.now();

        // Phase 1: lores sweep (single stripe, small grid)
        document.getElementById('compute-status').textContent = `Lores sweep...`;
        const loresN = Math.min(n, 100);
        const loresKey = `renders/${jobId}/lores.bin`;
        const tLores = performance.now();
        const loresResult = await lambdaPost('sweep', {
            job_id: jobId, stripe_idx: 0,
            function: funcName,
            n1: loresN, n2: loresN,
            i1_start: 0, i1_end: loresN,
            s3_key: loresKey,
        });
        const loresMs = performance.now() - tLores;
        const degree = loresResult.degree;
        log(`  lores: ${fmtMs(loresMs)}, degree=${degree}`, 'ok');

        // Phase 2: fan-out hires compute stripes
        document.getElementById('compute-status').textContent = `Computing 0/${nStripes} stripes...`;
        const rowsPer = Math.floor(n / nStripes);
        const tCompute = performance.now();
        let computeDone = 0;

        const sweepJobs = [];
        for (let s = 0; s < nStripes; s++) {
            const i1Start = s * rowsPer;
            const i1End = s < nStripes - 1 ? (s + 1) * rowsPer : n;
            sweepJobs.push({
                job_id: jobId, stripe_idx: s,
                function: funcName,
                n1: n, n2: n,
                i1_start: i1Start, i1_end: i1End,
            });
        }
        const stripeResults = await asyncPool(50, sweepJobs, p =>
            lambdaPost('sweep', p).then(r => {
                computeDone++;
                document.getElementById('compute-status').textContent =
                    `Computing ${computeDone}/${nStripes} stripes...`;
                return r;
            })
        );
        const computeWallMs = performance.now() - tCompute;

        // Phase 3: save calc.json metadata via storage Lambda
        const calcMeta = {
            job_id: jobId,
            function: funcName,
            n1: n, n2: n,
            n_stripes: nStripes,
            degree,
            lores: {
                bin_key: loresKey,
                n1: loresN, n2: loresN,
                bin_size: loresResult.bin_size,
            },
            stripes: stripeResults.map(r => ({
                idx: r.stripe_idx,
                bin_key: r.s3_key,
                bin_size: r.bin_size,
                compute_us: r.compute_us,
                n_t: r.n_t,
                avg_iterations: r.avg_iterations,
            })),
        };
        await lambdaPost('storage', { job_id: jobId, metadata: calcMeta }, '/save-metadata');
        _lastCalcMeta = calcMeta;

        const totalMs = performance.now() - tTotal;
        const totalBinSize = stripeResults.reduce((s, r) => s + r.bin_size, 0);
        const totalComputeUs = stripeResults.reduce((s, r) => s + r.compute_us, 0);
        const totalSteps = stripeResults.reduce((s, r) => s + r.n_t, 0);
        const avgIters = totalSteps > 0
            ? stripeResults.reduce((s, r) => s + r.avg_iterations * r.n_t, 0) / totalSteps
            : 0;

        // Populate results dir on both tabs
        document.getElementById('results-dir').value = jobId;
        document.getElementById('render-results-dir').value = jobId;

        document.getElementById('compute-status').textContent =
            `Computed | ${nStripes} stripes | wall ${fmtMs(computeWallMs)} | ` +
            `compute ${(totalComputeUs/1e6).toFixed(1)}s (sum) | deg ${degree} | total ${fmtMs(totalMs)}`;
        document.getElementById('compute-status').className = 'status ok';

        // Timing log
        const lines = [];
        lines.push(`  total:    ${fmtMs(totalMs)}`);
        lines.push(`  total bin: ${(totalBinSize/1e6).toFixed(1)}MB + lores ${(loresResult.bin_size/1e3).toFixed(0)}KB`);
        lines.push(`  compute: ${(totalComputeUs/1e6).toFixed(1)}s (sum) / ${fmtMs(computeWallMs)} wall (${nStripes} stripes)`);
        lines.push(`  lores:    ${fmtMs(loresMs)}`);
        lines.push(`Compute ${jobId}: ${funcName} deg${degree} N=${n}, avg_iters=${avgIters.toFixed(1)}`);
        for (const line of lines) log(line, 'ok');

    } catch (e) {
        document.getElementById('compute-status').textContent = 'Error: ' + e.message;
        document.getElementById('compute-status').className = 'status error';
        log(`Compute failed: ${e.message}`, 'err');
    } finally {
        btn.disabled = false;
    }
}


</script>
</body>
</html>
