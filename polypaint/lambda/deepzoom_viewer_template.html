<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PolyPaint DeepZoom — {job_id} / {export_id}</title>
<link rel="icon" href="data:,">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#111;color:#ccc;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
body{display:flex;flex-direction:column}
#hdr{flex:0 0 32px;background:#1a1a2e;display:flex;align-items:center;padding:0 12px;font-size:12px;border-bottom:1px solid #333;gap:16px}
#hdr .job{font-family:monospace;color:#e94560}
#hdr .sep{color:#555}
#hdr .ts{color:#666}
#hdr a{color:#4a9eff;text-decoration:none}
#hdr a:hover{text-decoration:underline}
#viewer{flex:0 0 auto;width:min(calc(100vw - 24px), calc(100vh - 56px));max-width:calc(100vw - 24px);aspect-ratio:1/1;position:relative;align-self:center;margin:12px auto}
#viewer-viewport-readout{position:absolute;left:12px;bottom:12px;z-index:20;max-width:min(420px,calc(100% - 24px));padding:8px 10px;border:1px solid #333;border-radius:4px;background:rgba(20,20,36,0.9);color:#bbb;font-family:monospace;font-size:11px;white-space:pre-wrap;pointer-events:none}
</style>
</head>
<body>
<div id="hdr">
  <span class="job">{job_id}</span>
  <span class="sep">/</span>
  <span>{export_id}</span>
  <span class="ts">{created_at}</span>
</div>
<div id="viewer">
  <div id="viewer-viewport-readout">Visible world viewport unavailable</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.1/openseadragon.min.js"></script>
<script>
const viewer = OpenSeadragon({
  element: document.getElementById('viewer'),
  tileSources: 'image.dzi',
  prefixUrl: 'https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.1/images/',
  showNavigator: true,
  navigatorPosition: 'BOTTOM_RIGHT',
  navigatorMaintainSizeRatio: false,
  navigatorWidth: '160px',
  navigatorHeight: '160px',
  maxZoomPixelRatio: 4,
});

const _viewerViewportState = { rafPending: false, meta: null };

function _requestAnimationFrameCompat(fn) {
  if (typeof window.requestAnimationFrame === 'function') return window.requestAnimationFrame(fn);
  return window.setTimeout(fn, 0);
}

function _formatViewportNumber(value) {
  const num = Number(value);
  if (!Number.isFinite(num)) return '?';
  if (num === 0) return '0';
  const mag = Math.abs(num);
  return mag >= 1e-4 && mag < 1e6 ? num.toFixed(6) : num.toExponential(6);
}

function _setViewportReadout(text) {
  const el = document.getElementById('viewer-viewport-readout');
  if (el) el.textContent = String(text || 'Visible world viewport unavailable');
}

function _clampViewportCoord(value, lo, hi) {
  return Math.max(lo, Math.min(hi, value));
}

function _rotateViewportPoint(re, im, pivotRe, pivotIm, angle) {
  const dx = Number(re) - Number(pivotRe);
  const dy = Number(im) - Number(pivotIm);
  const cosA = Math.cos(angle);
  const sinA = Math.sin(angle);
  return {
    re: Number(pivotRe) + (dx * cosA - dy * sinA),
    im: Number(pivotIm) + (dx * sinA + dy * cosA),
  };
}

function _cameraRectFromImageRect(meta, imgRect) {
  const x0 = _clampViewportCoord(Number(imgRect.x) || 0, 0, meta.width);
  const x1 = _clampViewportCoord(x0 + (Number(imgRect.width) || 0), 0, meta.width);
  const y0 = _clampViewportCoord(Number(imgRect.y) || 0, 0, meta.height);
  const y1 = _clampViewportCoord(y0 + (Number(imgRect.height) || 0), 0, meta.height);
  const min_re = meta.minRe + (x0 / meta.width) * (meta.maxRe - meta.minRe);
  const max_re = meta.minRe + (x1 / meta.width) * (meta.maxRe - meta.minRe);
  const max_im = meta.maxIm - (y0 / meta.height) * (meta.maxIm - meta.minIm);
  const min_im = meta.maxIm - (y1 / meta.height) * (meta.maxIm - meta.minIm);
  if (![min_re, max_re, min_im, max_im].every((value) => Number.isFinite(value))) return null;
  return {
    min_re,
    max_re,
    min_im,
    max_im,
    center_re: (min_re + max_re) / 2,
    center_im: (min_im + max_im) / 2,
    span_re: max_re - min_re,
    span_im: max_im - min_im,
  };
}

function _renderBoundsFromCameraRect(meta, cameraRect) {
  if (!meta || !cameraRect) return null;
  const viewportCenterRe = (meta.minRe + meta.maxRe) / 2;
  const viewportCenterIm = (meta.minIm + meta.maxIm) / 2;
  let centerRe = cameraRect.center_re;
  let centerIm = cameraRect.center_im;
  if (meta.rotation !== 0) {
    const unrot = _rotateViewportPoint(
      cameraRect.center_re,
      cameraRect.center_im,
      viewportCenterRe,
      viewportCenterIm,
      -meta.rotation
    );
    centerRe = unrot.re;
    centerIm = unrot.im;
  }
  const min_re = centerRe - (cameraRect.span_re / 2);
  const max_re = centerRe + (cameraRect.span_re / 2);
  const min_im = centerIm - (cameraRect.span_im / 2);
  const max_im = centerIm + (cameraRect.span_im / 2);
  if (![min_re, max_re, min_im, max_im].every((value) => Number.isFinite(value))) return null;
  return {
    min_re,
    max_re,
    min_im,
    max_im,
    center_re: centerRe,
    center_im: centerIm,
    span_re: cameraRect.span_re,
    span_im: cameraRect.span_im,
    rotation: meta.rotation,
  };
}

function _computeVisibleBounds(meta) {
  if (!meta) return null;
  if (!viewer || !viewer.viewport || typeof viewer.viewport.getBounds !== 'function' || typeof viewer.viewport.viewportToImageRectangle !== 'function') return null;
  const bounds = viewer.viewport.getBounds(true);
  if (!bounds) return null;
  const imgRect = viewer.viewport.viewportToImageRectangle(bounds);
  if (!imgRect) return null;
  const cameraRect = _cameraRectFromImageRect(meta, imgRect);
  if (!cameraRect) return null;
  return _renderBoundsFromCameraRect(meta, cameraRect);
}

function _renderViewportReadout() {
  const meta = _viewerViewportState.meta;
  if (!meta || !meta.hasViewport) {
    _setViewportReadout('Visible world viewport unavailable');
    return;
  }
  const visible = _computeVisibleBounds(meta);
  if (!visible) {
    _setViewportReadout('Visible world viewport unavailable');
    return;
  }
  let text = `Visible world viewport\n`
    + `min_re=${_formatViewportNumber(visible.min_re)}  max_re=${_formatViewportNumber(visible.max_re)}\n`
    + `min_im=${_formatViewportNumber(visible.min_im)}  max_im=${_formatViewportNumber(visible.max_im)}\n`
    + `center=(${_formatViewportNumber(visible.center_re)}, ${_formatViewportNumber(visible.center_im)})\n`
    + `span=(${_formatViewportNumber(visible.span_re)} x ${_formatViewportNumber(visible.span_im)})`;
  if (meta.rotation !== 0) {
    text += `\nrotation=${_formatViewportNumber(meta.rotation)} (preserved)`;
  }
  _setViewportReadout(text);
}

function _scheduleViewportReadout() {
  if (_viewerViewportState.rafPending) return;
  _viewerViewportState.rafPending = true;
  _requestAnimationFrameCompat(() => {
    _viewerViewportState.rafPending = false;
    _renderViewportReadout();
  });
}

async function _loadViewportMeta() {
  try {
    const resp = await fetch('meta.json');
    if (!resp.ok) {
      _viewerViewportState.meta = null;
      _scheduleViewportReadout();
      return;
    }
    const meta = await resp.json();
    const width = Number(meta.width);
    const height = Number(meta.height);
    const minRe = Number(meta.viewport_min_re);
    const maxRe = Number(meta.viewport_max_re);
    const minIm = Number(meta.viewport_min_im);
    const maxIm = Number(meta.viewport_max_im);
    const rotation = Number(meta.source_rotation);
    _viewerViewportState.meta = {
      width,
      height,
      minRe,
      maxRe,
      minIm,
      maxIm,
      rotation: Number.isFinite(rotation) ? rotation : 0,
      hasViewport: (
        Number.isFinite(width) &&
        Number.isFinite(height) &&
        width > 0 &&
        height > 0 &&
        Number.isFinite(minRe) &&
        Number.isFinite(maxRe) &&
        Number.isFinite(minIm) &&
        Number.isFinite(maxIm) &&
        maxRe > minRe &&
        maxIm > minIm
      ),
    };
  } catch (err) {
    _viewerViewportState.meta = null;
  }
  _scheduleViewportReadout();
}

['open', 'animation', 'animation-finish', 'resize'].forEach((eventName) => {
  viewer.addHandler(eventName, _scheduleViewportReadout);
});
_loadViewportMeta();
</script>
</body>
</html>
