[project]
name = "polypaint"
version = "0.1.0"
description = "Polypaint tooling scripts"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.42.88",
    "google-genai>=1.72.0",
    "numpy>=2.4.4",
    "pillow>=12.2.0",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
