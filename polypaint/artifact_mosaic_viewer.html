<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PolyPaint Artifact Mosaic</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#08090c;color:#d7dde8;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
body{display:flex;flex-direction:column}
#hdr{min-height:38px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:7px 12px;background:#111827;border-bottom:1px solid #263244;font-size:12px}
#hdr strong{color:#f8fafc}
#hdr code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#93c5fd}
#hdr a{color:#60a5fa;text-decoration:none}
#hdr a:hover{text-decoration:underline}
#viewer{flex:1 1 auto;min-height:0;background:#050505}
#status{color:#9ca3af}
#status.err{color:#f87171}
#ctx{position:fixed;z-index:50;display:none;min-width:260px;max-width:340px;background:#111827;border:1px solid #2B3A5E;border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.6);font-size:12px;overflow:hidden}
#ctx .ctx-head{padding:8px 12px;background:#0d1320;border-bottom:1px solid #263244;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#93c5fd;word-break:break-all}
#ctx table{border-collapse:collapse;margin:8px 12px}
#ctx td{padding:2px 8px 2px 0;vertical-align:top}
#ctx td:first-child{color:#9ca3af;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;text-transform:uppercase}
#ctx .ctx-actions{display:flex;gap:8px;padding:10px 12px;border-top:1px solid #263244}
#ctx button{flex:1 1 auto;background:#1f2a44;color:#F2F2F7;border:1px solid #2B3A5E;border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer}
#ctx button:hover{border-color:#E94560}
#ctx button:disabled{opacity:.6;cursor:default}
#ctx .ctx-err{color:#f87171;padding:0 12px 8px;font-size:11px}
</style>
</head>
<body>
<div id="hdr">
  <strong id="title">Artifact Mosaic</strong>
  <span id="status">Loading...</span>
  <span id="meta"></span>
  <a id="manifest-link" href="#" target="_blank" rel="noopener noreferrer" style="display:none">manifest</a>
</div>
<div id="viewer"></div>
<div id="ctx">
  <div class="ctx-head" id="ctx-id"></div>
  <table id="ctx-rows"></table>
  <div class="ctx-err" id="ctx-err" style="display:none"></div>
  <div class="ctx-actions">
    <button id="ctx-download" type="button">Download image</button>
    <button id="ctx-close" type="button">Close</button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.1/openseadragon.min.js"></script>
<script>
const TRANSPARENT_TILE = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==';

function qs(name, fallback = '') {
  const params = new URLSearchParams(window.location.search || '');
  return params.get(name) || fallback;
}

function setStatus(text, cls = '') {
  const el = document.getElementById('status');
  if (!el) return;
  el.textContent = text;
  el.className = cls;
}

function publicUrl(manifest, key) {
  const base = (manifest && manifest.base) || 'https://polypaint.s3.us-east-1.amazonaws.com/';
  return base + encodeURI(String(key || ''));
}

function tileSizeForSelection(tiles, selectedSize) {
  if (selectedSize && selectedSize !== 'all') {
    const n = Number(selectedSize);
    if (Number.isFinite(n) && n > 0) return n;
  }
  const values = (Array.isArray(tiles) ? tiles : [])
    .map(t => Number(t && t.preview_width))
    .filter(n => Number.isFinite(n) && n > 0);
  return values.length ? Math.max(...values) : 512;
}

function seededValue(tile, seed) {
  const artifactId = tile.palette_id || tile.artifact_id || '';
  const s = `${tile.job_id || ''}|${artifactId}|${seed}`;
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function filteredSortedTiles(manifest, options) {
  let tiles = Array.isArray(manifest && manifest.tiles) ? manifest.tiles.slice() : [];
  const size = String(options.size || 'all');
  if (size !== 'all') {
    const n = Number(size);
    tiles = tiles.filter(t => Number(t.preview_width) === n && Number(t.preview_height) === n);
  }
  const aid = (x) => String(x.palette_id || x.artifact_id || '');
  const mode = String(options.sort || 'date');
  tiles.sort((a, b) => {
    if (mode === 'job') {
      return String(b.job_id || '').localeCompare(String(a.job_id || '')) ||
        String(b.created_at || '').localeCompare(String(a.created_at || '')) ||
        aid(a).localeCompare(aid(b));
    }
    if (mode === 'function') {
      return String(a.function || '').localeCompare(String(b.function || '')) ||
        String(b.created_at || '').localeCompare(String(a.created_at || ''));
    }
    if (mode === 'degree') {
      return (Number(a.degree || 0) - Number(b.degree || 0)) ||
        String(b.created_at || '').localeCompare(String(a.created_at || ''));
    }
    if (mode === 'N') {
      return (Number(a.N || 0) - Number(b.N || 0)) ||
        String(b.created_at || '').localeCompare(String(a.created_at || ''));
    }
    if (mode === 'random') return seededValue(a, 1) - seededValue(b, 1);
    return String(b.created_at || '').localeCompare(String(a.created_at || '')) ||
      String(a.job_id || '').localeCompare(String(b.job_id || '')) ||
      aid(a).localeCompare(aid(b));
  });
  return tiles;
}

function requestedCols(count) {
  const raw = qs('cols', '');
  const value = Number(raw);
  if (Number.isFinite(value) && value >= 1) return Math.floor(value);
  return Math.max(1, Math.ceil(Math.sqrt(Math.max(1, count || 1))));
}

function tileSource(manifest, tiles, options) {
  const tileSize = tileSizeForSelection(tiles, options.size);
  const cols = requestedCols(tiles.length);
  const rows = Math.max(1, Math.ceil((tiles.length || 1) / cols));
  return {
    width: cols * tileSize,
    height: rows * tileSize,
    tileSize,
    tileOverlap: 0,
    minLevel: 0,
    maxLevel: 0,
    getTileUrl(level, x, y) {
      const tile = tiles[y * cols + x];
      return tile ? publicUrl(manifest, tile.key) : TRANSPARENT_TILE;
    },
  };
}

async function main() {
  const manifestUrl = qs('manifest', '');
  const kind = qs('kind', 'color');
  const size = qs('size', 'all');
  const sort = qs('sort', 'date');
  if (!manifestUrl) throw new Error('Missing manifest query parameter');
  const manifestLink = document.getElementById('manifest-link');
  if (manifestLink) {
    manifestLink.href = manifestUrl;
    manifestLink.style.display = '';
  }
  const resp = await fetch(manifestUrl + (manifestUrl.includes('?') ? '&' : '?') + 'ts=' + Date.now());
  if (!resp.ok) throw new Error(`Manifest fetch failed: ${resp.status}`);
  const manifest = await resp.json();
  if (!manifest || !Array.isArray(manifest.tiles)) throw new Error('Invalid mosaic manifest');
  const tiles = filteredSortedTiles(manifest, {size, sort});
  const title = document.getElementById('title');
  if (title) title.textContent = `${kind === 'palette' ? 'AllPal' : 'AllCol'} Share`;
  const meta = document.getElementById('meta');
  if (meta) {
    const total = Number(manifest.count || manifest.tiles.length || 0);
    meta.innerHTML = `<code>${tiles.length.toLocaleString()}</code> shown / <code>${total.toLocaleString()}</code> total · size <code>${size}</code> · sort <code>${sort}</code>`;
  }
  // Composite wall pyramid (deepzoom-speed.md §7.1): derived from the
  // manifest's refresh_id at the CANONICAL _index path — share links point
  // at snapshot manifests (mosaic-shares/…/manifest.json), so deriving from
  // the manifest URL breaks there. Default view only; custom cols would not
  // match the baked grid. Pruned/unbuilt wall → per-tile grid fallback.
  let wallSource = null;
  let wallMeta = null;
  const colsParam = qs('cols', '');
  if (sort === 'date' && size === 'all' && !colsParam) {
    try {
      const wallKind = String(manifest.artifact_kind || kind || 'color');
      const rid = String(manifest.refresh_id || '');
      const base = manifest.base || 'https://polypaint.s3.us-east-1.amazonaws.com/';
      if (rid) {
        const wallUrl = base + encodeURI(`renders/_index/${wallKind}_mosaic/${rid}/wall.json`);
        const wallResp = await fetch(wallUrl + '?ts=' + Date.now());
        if (wallResp.ok) {
          const wall = await wallResp.json();
          if (wall && wall.dzi_key && String(wall.refresh_id || '') === rid) {
            wallSource = base + encodeURI(String(wall.dzi_key));
            wallMeta = wall;
          }
        }
      }
    } catch (e) { /* no wall for this refresh: per-tile grid below */ }
  }
  setStatus(wallSource ? 'Ready · wall pyramid' : 'Ready');
  const gridSource = wallSource ? null : tileSource(manifest, tiles, {size, sort});
  // pixel->cell mapping state, identical math in both modes
  const view = wallMeta ? {
    tiles: Array.isArray(wallMeta.tiles) ? wallMeta.tiles : tiles,
    cols: Number(wallMeta.cols) || 1,
    cellPx: Number(wallMeta.cell_px) || 512,
  } : {
    tiles,
    cols: gridSource ? Math.round(gridSource.width / gridSource.tileSize) : 1,
    cellPx: gridSource ? gridSource.tileSize : 512,
  };
  const viewer = OpenSeadragon({
    element: document.getElementById('viewer'),
    tileSources: wallSource || gridSource,
    prefixUrl: 'https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.1/images/',
    showNavigator: true,
    navigatorPosition: 'BOTTOM_RIGHT',
    maxZoomPixelRatio: 2,
    imageLoaderLimit: 16,
  });
  wireContextMenu(viewer, view, manifest, kind);
}

// ── right-click a tile: details + download of the full-resolution image ──

function tileFromPixel(viewer, view, pixelPoint) {
  const viewport = viewer && viewer.viewport;
  if (!viewport || !view.tiles.length) return null;
  const imagePoint = viewport.viewportToImageCoordinates(viewport.pointFromPixel(pixelPoint));
  const x = Math.floor(imagePoint.x / view.cellPx);
  const y = Math.floor(imagePoint.y / view.cellPx);
  if (x < 0 || y < 0 || x >= view.cols) return null;
  return view.tiles[y * view.cols + x] || null;
}

function fmtMB(bytes) {
  return bytes > 0 ? `${(bytes / 1e6).toFixed(1)} MB` : '';
}

function wireContextMenu(viewer, view, manifest, kind) {
  const ctx = document.getElementById('ctx');
  const rowsEl = document.getElementById('ctx-rows');
  const idEl = document.getElementById('ctx-id');
  const errEl = document.getElementById('ctx-err');
  const dlBtn = document.getElementById('ctx-download');
  let current = null;
  let headSeq = 0;

  function hide() { ctx.style.display = 'none'; current = null; }

  function detailRows(tile) {
    const aid = String(tile.palette_id || tile.artifact_id || '');
    const rows = [
      ['job', tile.job_id],
      ['function', tile.function],
      ['degree', tile.degree],
      ['N', tile.N],
      ['times', tile.times],
      ['created', String(tile.created_at || '').replace('T', ' ').replace('Z', '')],
      ['image', ''],
    ];
    idEl.textContent = aid;
    rowsEl.innerHTML = rows
      .filter(([, v]) => v !== undefined && v !== null && String(v) !== '')
      .map(([k, v]) => `<tr><td>${k}</td><td id="ctx-${k === 'image' ? 'imginfo' : 'x' + k}">${String(v)}</td></tr>`)
      .join('');
  }

  async function describeImage(tile) {
    const seq = ++headSeq;
    const cell = document.getElementById('ctx-imginfo');
    if (!cell) return;
    cell.textContent = '…';
    try {
      const head = await fetch(publicUrl(manifest, tile.image_key), {method: 'HEAD'});
      if (seq !== headSeq || !head.ok) { if (cell && seq === headSeq) cell.textContent = 'unavailable'; return; }
      const w = head.headers.get('x-amz-meta-width');
      const h = head.headers.get('x-amz-meta-height');
      const mb = fmtMB(Number(head.headers.get('content-length') || 0));
      cell.textContent = [w && h ? `${w}×${h}px` : '', mb].filter(Boolean).join(' · ') || 'ready';
    } catch (e) {
      if (seq === headSeq && cell) cell.textContent = 'unavailable';
    }
  }

  function show(tile, clientX, clientY) {
    current = tile;
    errEl.style.display = 'none';
    dlBtn.disabled = !tile.image_key;
    dlBtn.textContent = 'Download image';
    detailRows(tile);
    ctx.style.display = 'block';
    const rect = ctx.getBoundingClientRect();
    ctx.style.left = `${Math.max(8, Math.min(clientX, window.innerWidth - rect.width - 8))}px`;
    ctx.style.top = `${Math.max(8, Math.min(clientY, window.innerHeight - rect.height - 8))}px`;
    describeImage(tile);
  }

  async function download() {
    const tile = current;
    if (!tile || !tile.image_key) return;
    const aid = String(tile.palette_id || tile.artifact_id || 'image');
    const ext = (String(tile.image_key).split('.').pop() || 'jpeg').toLowerCase();
    dlBtn.disabled = true;
    errEl.style.display = 'none';
    try {
      const resp = await fetch(publicUrl(manifest, tile.image_key));
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const total = Number(resp.headers.get('content-length') || 0);
      const reader = resp.body.getReader();
      const chunks = [];
      let got = 0;
      for (;;) {
        const {done, value} = await reader.read();
        if (done) break;
        chunks.push(value);
        got += value.length;
        dlBtn.textContent = total
          ? `Downloading… ${Math.round(100 * got / total)}%`
          : `Downloading… ${fmtMB(got)}`;
      }
      const blob = new Blob(chunks, {type: resp.headers.get('content-type') || 'image/jpeg'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${aid}.${ext}`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      dlBtn.textContent = `Saved ${fmtMB(got) || 'file'}`;
      setTimeout(() => { dlBtn.textContent = 'Download image'; dlBtn.disabled = false; }, 1600);
    } catch (e) {
      errEl.textContent = `Download failed: ${e.message}`;
      errEl.style.display = 'block';
      dlBtn.textContent = 'Download image';
      dlBtn.disabled = false;
    }
  }

  dlBtn.addEventListener('click', download);
  document.getElementById('ctx-close').addEventListener('click', hide);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hide(); });
  document.addEventListener('pointerdown', (e) => { if (!ctx.contains(e.target)) hide(); });

  viewer.addHandler('canvas-contextmenu', (event) => {
    if (event.originalEvent) event.originalEvent.preventDefault();
    event.preventDefault = true;
    const tile = tileFromPixel(viewer, view, event.position);
    if (!tile) { hide(); return; }
    const raw = event.originalEvent || {};
    show(tile, Number(raw.clientX || 20), Number(raw.clientY || 20));
  });
  viewer.element.addEventListener('contextmenu', (e) => e.preventDefault());

  // touch: a long-press (~600ms without dragging) opens the same panel
  let press = null;
  viewer.addHandler('canvas-press', (event) => {
    press = {t: Date.now(), pos: event.position};
  });
  viewer.addHandler('canvas-release', (event) => {
    if (!press) return;
    const held = Date.now() - press.t;
    const moved = Math.hypot(event.position.x - press.pos.x, event.position.y - press.pos.y);
    if (held > 600 && moved < 12) {
      const tile = tileFromPixel(viewer, view, event.position);
      if (tile) {
        const raw = event.originalEvent || {};
        const cx = raw.clientX || (raw.changedTouches && raw.changedTouches[0] && raw.changedTouches[0].clientX) || 20;
        const cy = raw.clientY || (raw.changedTouches && raw.changedTouches[0] && raw.changedTouches[0].clientY) || 20;
        show(tile, Number(cx), Number(cy));
      }
    }
    press = null;
  });
}

main().catch(err => {
  setStatus(err && err.message ? err.message : String(err), 'err');
});
</script>
</body>
</html>
