<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PolyPaint DeepZoom — {job_id} / {export_id}</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#111;color:#ccc;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
#hdr{height:32px;background:#1a1a2e;display:flex;align-items:center;padding:0 12px;font-size:12px;border-bottom:1px solid #333;gap:16px}
#hdr .job{font-family:monospace;color:#e94560}
#hdr .sep{color:#555}
#hdr .ts{color:#666}
#hdr a{color:#4a9eff;text-decoration:none}
#hdr a:hover{text-decoration:underline}
#viewer{position:absolute;top:32px;left:0;right:0;bottom:0}
</style>
</head>
<body>
<div id="hdr">
  <span class="job">{job_id}</span>
  <span class="sep">/</span>
  <span>{export_id}</span>
  <span class="ts">{created_at}</span>
  <a href="{dzi_url}" target="_blank">DZI</a>
</div>
<div id="viewer"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.1/openseadragon.min.js"></script>
<script>
OpenSeadragon({
  element: document.getElementById('viewer'),
  tileSources: '{dzi_url}',
  prefixUrl: 'https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.1/images/',
  showNavigator: true,
  navigatorPosition: 'BOTTOM_RIGHT',
  maxZoomPixelRatio: 4,
});
</script>
</body>
</html>
